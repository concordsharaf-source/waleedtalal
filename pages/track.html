<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تتبع المعاملة</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

body{
margin:0;
font-family:'Cairo',sans-serif;
background:#f0f2f5;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
}


.card{
width:90%;
max-width:420px;
background:#1a4332;
padding:35px;
border-radius:25px;
box-shadow:0 15px 40px rgba(0,0,0,.3);
color:white;
text-align:center;
}


.logo{
width:100px;
height:100px;
border-radius:50%;
background:url('images/xx.jpg');
background-size:cover;
background-position:center;
margin:auto;
border:4px solid white;
}


h1{
font-size:28px;
margin:20px 0;
}


p{
opacity:.9;
}


label{
display:block;
text-align:right;
margin:15px 0 7px;
font-weight:bold;
}


input{
width:100%;
padding:15px;
border-radius:12px;
border:none;
font-size:16px;
box-sizing:border-box;
}


button{
width:100%;
padding:16px;
margin-top:25px;
border:none;
border-radius:15px;
background:linear-gradient(to right,#25D366,#128C7E);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}


.result{
display:none;
margin-top:25px;
background:white;
color:#333;
padding:20px;
border-radius:15px;
}


</style>

</head>


<body>


<div class="card">


<div class="logo"></div>


<h1>
تتبع المعاملة
</h1>


<p>
أدخل بياناتك لمعرفة حالة الطلب
</p>


<label>
رقم المعاملة
</label>

<input id="transactionId" type="text" placeholder="مثال: 4827">



<label>
رقم الهوية
</label>

<input id="idNumber" type="text" placeholder="رقم الهوية">



<button onclick="checkTransaction()">
بحث عن المعاملة
</button>



<div class="result" id="result"></div>


</div>



<script>

function checkTransaction(){


let transactionId=document.getElementById("transactionId").value.trim();

let idNumber=document.getElementById("idNumber").value.trim();


// البيانات الصحيحة

let correctTransaction="4827";

let correctId="123456789";



// تحويل الأرقام العربية إلى إنجليزية

transactionId=transactionId.replace(/[٠-٩]/g,function(x){

return "٠١٢٣٤٥٦٧٨٩".indexOf(x);

});


idNumber=idNumber.replace(/[٠-٩]/g,function(x){

return "٠١٢٣٤٥٦٧٨٩".indexOf(x);

});



// مقارنة البيانات

if(transactionId === correctTransaction && idNumber === correctId){


window.location.href="status.html";


}

else{


let result=document.getElementById("result");

result.style.display="block";

result.innerHTML=
`
<h3 style="color:red;text-align:center">
خطأ
</h3>

<p style="text-align:center">
رقم المعاملة أو رقم الهوية غير صحيح
</p>
`;

}


}

</script>


</body>

</html>
