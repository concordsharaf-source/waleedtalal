<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تتبع المعاملة</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');


body{

margin:0;

font-family:'Cairo',sans-serif;

background:#f0f2f5;

display:flex;

justify-content:center;

align-items:center;

min-height:100vh;

}



.card{

width:90%;

max-width:420px;

background:#1a4332;

padding:35px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.3);

color:white;

text-align:center;

}



.logo{

width:100px;

height:100px;

border-radius:50%;

background:url('images/xx.jpg');

background-size:cover;

background-position:center;

margin:auto;

border:4px solid white;

}



h1{

font-size:28px;

margin:20px 0;

}



p{

opacity:.9;

}



label{

display:block;

text-align:right;

margin:15px 0 7px;

font-weight:bold;

}



input{

width:100%;

padding:15px;

border-radius:12px;

border:none;

font-size:16px;

box-sizing:border-box;

}



button{

width:100%;

padding:16px;

margin-top:25px;

border:none;

border-radius:15px;

background:linear-gradient(to right,#25D366,#128C7E);

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.result{

display:none;

margin-top:25px;

background:white;

color:#333;

padding:20px;

border-radius:15px;

}


</style>

</head>



<body>


<div class="card">


<div class="logo"></div>


<h1>
تتبع المعاملة
</h1>


<p>
أدخل بياناتك لمعرفة حالة الطلب
</p>


<!-- تم جعل رقم الجوال في الخانة الأولى -->
<label>
رقم الجوال
</label>

<input 
id="phone"
type="text"
placeholder="رقم الجوال">


<!-- تم جعل رقم المعاملة في الخانة الثانية -->
<label>
رقم المعاملة
</label>

<input 
id="transactionId"
type="text"
placeholder="مثال: 5473">


<button onclick="checkTransaction()">

بحث عن المعاملة

</button>



<div id="result" class="result"></div>



</div>






<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {

getFirestore,

collection,

query,

where,

getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyDD_I84b3b6bmVx-t2g7Cbd6RPcYz_Q",

authDomain: "sparepartswebsite1.firebaseapp.com",

projectId: "sparepartswebsite1",

storageBucket: "sparepartswebsite1.firebasestorage.app",

messagingSenderId: "1063114847735",

appId: "1:1063114847735:web:0e764c150ab10df2d82af2"


};



const app = initializeApp(firebaseConfig);


const db = getFirestore(app);





function convertNumbers(value){

return value.replace(/[٠-٩]/g,function(d){

return "٠١٢٣٤٥٦٧٨٩".indexOf(d);

});

}





window.checkTransaction = async function(){



let transactionId =
document.getElementById("transactionId").value.trim();



let phone =
document.getElementById("phone").value.trim();




transactionId = convertNumbers(transactionId);

phone = convertNumbers(phone);





let result =
document.getElementById("result");



if(!transactionId || !phone){


result.style.display="block";


result.innerHTML=

`

<h3 style="color:red">
تنبيه
</h3>

<p>
أدخل رقم المعاملة ورقم الجوال
</p>

`;


return;

}





try{


const q = query(

collection(db,"orders"),

where("transactionId","==",transactionId),

where("phone","==",phone)

);




const snapshot = await getDocs(q);





if(snapshot.empty){


result.style.display="block";


result.innerHTML=

`

<h3 style="color:red">
خطأ
</h3>


<p>
رقم المعاملة أو رقم الجوال غير صحيح
</p>

`;


return;


}





snapshot.forEach((doc)=>{


let data = doc.data();



// الانتقال إلى صفحة الحالة

window.location.href =

"status.html?transactionId="

+ data.transactionId

+"&phone="

+ data.phone;



});




}

catch(error){


console.log(error);



result.style.display="block";


result.innerHTML=

`

<h3 style="color:red">
حدث خطأ
</h3>

<p>
تعذر الاتصال بقاعدة البيانات
</p>

`;

}



}



</script>


</body>

</html>
