<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤسسة الوليد الإنسانية | طلب مساعدة</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');

    :root {
      --header-bg-image: url('images/xx.jpg');
      --card-bg-dark: #1a4332;
      --input-bg-light: #f8f9fa;
      --text-on-dark: #FFFFFF;
      --accent-green: #25D366;
    }

    body {
      font-family: 'Cairo', Tahoma, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f2f5;
      color: #333;
    }

    header {
      background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), var(--header-bg-image);
      background-size: cover;
      height: 40vh;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .logo {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background-image: var(--header-bg-image);
      background-size: cover;
      border: 4px solid #fff;
    }

    .card {
      background-color: var(--card-bg-dark);
      padding: 35px;
      border-radius: 25px;
      margin: 30px auto;
      max-width: 700px;
      color: white;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      margin-top: 6px;
    }

    button {
      width: 100%;
      padding: 15px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .whatsapp-float {
      position: fixed;
      bottom: 30px;
      left: 30px;
      background: #25D366;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-size: 28px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<header>
  <div class="logo"></div>
  <h1>مؤسسة الوليد الإنسانية</h1>
</header>

<div class="card">
  <h2>طلب مساعدة</h2>

  <input id="name" placeholder="الاسم">
  <input id="phone" placeholder="رقم الجوال">
  <input id="location" placeholder="الدولة">
  <select id="type">
    <option>مالية</option>
    <option>سكنية</option>
    <option>سيارات</option>
  </select>
  <textarea id="notes" placeholder="التفاصيل"></textarea>

  <button onclick="sendWhatsApp()">إرسال عبر واتساب</button>
</div>

<footer>
  <p>📧 lamiamagedoffice1@gmail.com</p>
  <p>📱 966569872542</p>
  <a href="https://wa.me/966569872542" style="color:#25D366;">تواصل واتساب</a>
</footer>

<a class="whatsapp-float" href="https://wa.me/966569872542">💬</a>

<script>
function sendWhatsApp() {
  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const location = document.getElementById("location").value;
  const type = document.getElementById("type").value;
  const notes = document.getElementById("notes").value;

  if(!name || !phone || !location || !notes){
    alert("يرجى تعبئة جميع البيانات");
    return;
  }

  const adminPhone = "966569872542";

  let message =
`📌 طلب مساعدة جديد

👤 الاسم: ${name}
📞 الجوال: ${phone}
🌍 الدولة: ${location}
🏷️ النوع: ${type}
📝 التفاصيل: ${notes}`;

  const url = `https://wa.me/${adminPhone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}
</script>

</body>
</html>
