<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>طلب مساعدة -  </title>

<style>
*{
 box-sizing:border-box;
 font-family:Tajawal,Arial;
}

body{
 margin:0;
 background:#f4f7f5;
 color:#222;
}

.header{
 background:#087f3d;
 color:white;
 padding:18px;
 text-align:center;
 font-size:22px;
 font-weight:bold;
}

.demo{
 background:#fff3cd;
 color:#856404;
 text-align:center;
 padding:10px;
 font-size:15px;
}

.container{
 width:92%;
 max-width:500px;
 margin:20px auto;
 background:white;
 padding:20px;
 border-radius:18px;
 box-shadow:0 5px 20px #0002;
}

label{
 display:block;
 margin-top:12px;
 font-weight:bold;
}

input,select,textarea{
 width:100%;
 padding:13px;
 margin-top:6px;
 border-radius:12px;
 border:1px solid #ddd;
 outline:none;
 font-size:15px;
}

textarea{
 height:100px;
 resize:none;
}


button{
 width:100%;
 border:none;
 padding:14px;
 margin-top:15px;
 border-radius:12px;
 font-size:16px;
 cursor:pointer;
 font-weight:bold;
}


.send{
 background:#087f3d;
 color:white;
}


.result{
 display:none;
 margin-top:20px;
 background:#f8f8f8;
 padding:18px;
 border-radius:15px;
 text-align:center;
}


.code{
 font-size:28px;
 color:#087f3d;
 letter-spacing:3px;
 font-weight:bold;
}


.actions{
 display:flex;
 gap:10px;
}


.actions button{
 flex:1;
}


.copy{
 background:#0a9b4b;
 color:white;
}


.whatsapp{
 background:#25d366;
 color:white;
}


.note{
 position:fixed;
 top:20px;
 right:50%;
 transform:translateX(50%);
 background:#087f3d;
 color:white;
 padding:12px 20px;
 border-radius:30px;
 display:none;
}

</style>


<!-- Firebase -->
<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getFirestore, collection, addDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// ضع بيانات مشروعك هنا

const firebaseConfig = {

apiKey: "ضع_API_KEY",

authDomain: "ضع_AUTH_DOMAIN",

projectId: "ضع_PROJECT_ID",

storageBucket: "ضع_STORAGE_BUCKET",

messagingSenderId: "ضع_SENDER_ID",

appId: "ضع_APP_ID"

};


const app = initializeApp(firebaseConfig);

window.db = getFirestore(app);

</script>


</head>

<body>


<div class="header">
موقع طلب المساعدة
</div>


<div class="demo">
⚠️     
</div


<div class="container">


<label>الاسم الكامل</label>
<input id="name">


<label>رقم الجوال</label>
<input id="phone" type="tel">


<label>البريد الإلكتروني</label>
<input id="email" type="email">


<label>رقم الهوية</label>
<input id="idNumber">


<label>نوع المساعدة</label>

<select id="help">

<option>اختر نوع المساعدة</option>

<option>مساعدة مالية</option>

<option>مساعدة علاجية</option>

<option>مساعدة تعليمية</option>

<option>أخرى</option>

</select>


<label>تفاصيل الطلب</label>

<textarea id="details"></textarea>


<button class="send" onclick="sendData()">
إرسال الطلب
</button>


<div class="result" id="result">


<h3>تم استقبال طلبك</h3>


<p>رمز المعاملة</p>

<div class="code" id="code"></div>


<div class="actions">

<button class="copy" onclick="copyCode()">
نسخ الكود
</button>


<button class="whatsapp" id="wa" onclick="sendWhatsApp()" disabled>
إرسال واتساب
</button>


</div>


</div>


</div>


<div class="note" id="note">
تم النسخ بنجاح
</div>
<script type="module">

import { collection, addDoc }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


// توليد كود مثل A1234

function generateCode(){

let letter = String.fromCharCode(
65 + Math.floor(Math.random()*26)
);

let numbers = Math.floor(
1000 + Math.random()*9000
);

return letter + numbers;

}



let transactionCode = "";

let copied = false;



window.sendData = async function(){


let name =
document.getElementById("name").value.trim();


let phone =
document.getElementById("phone").value.trim();


let email =
document.getElementById("email").value.trim();


let idNumber =
document.getElementById("idNumber").value.trim();


let help =
document.getElementById("help").value;


let details =
document.getElementById("details").value.trim();



if(
!name ||
!phone ||
!email ||
!idNumber ||
help==="اختر نوع المساعدة" ||
!details
){

alert("يرجى تعبئة جميع البيانات");

return;

}



transactionCode = generateCode();



try{


await addDoc(
collection(window.db,"requests"),
{

name:name,

phone:phone,

email:email,

idNumber:idNumber,

helpType:help,

details:details,

code:transactionCode,

date:new Date()

}

);



document.getElementById("code").innerText =
transactionCode;


document.getElementById("result").style.display =
"block";



}
catch(error){

alert("حدث خطأ في إرسال البيانات");

console.log(error);

}



};




// نسخ الكود

window.copyCode=function(){


navigator.clipboard.writeText(transactionCode)
.then(()=>{


copied=true;


document.getElementById("wa").disabled=false;


let note=document.getElementById("note");

note.style.display="block";


setTimeout(()=>{

note.style.display="none";

},2500);



});


};




// إرسال واتساب

window.sendWhatsApp=function(){


if(!copied){

return;

}



let phoneNumber="ضع_رقم_الواتساب_هنا";



let message=
`
طلب مساعدة جديد

الاسم:
${document.getElementById("name").value}

رقم الجوال:
${document.getElementById("phone").value}

البريد:
${document.getElementById("email").value}

رقم الهوية:
${document.getElementById("idNumber").value}

نوع المساعدة:
${document.getElementById("help").value}

التفاصيل:
${document.getElementById("details").value}

رمز المعاملة:
${transactionCode}
`;



let url=
"https://wa.me/"+phoneNumber+
"?text="+encodeURIComponent(message);



window.open(url,"_blank");


};


</script>
</body>
</html>
