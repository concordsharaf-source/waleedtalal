<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>مؤسسة الوليد للمساعدات الإنسانية | طلب مساعدة</title>


<style>

@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');


*{
box-sizing:border-box;
}


body{

font-family:'Cairo',Tahoma,sans-serif;

margin:0;

padding:0;

background:#f0f2f5;

color:#333;

line-height:1.6;

}



header{

background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.7)),
url('images/xx.jpg');

background-size:cover;

background-position:center;

height:40vh;

color:white;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

text-align:center;

padding:20px;

}



.logo{

width:110px;

height:110px;

background:white;

background-image:url('images/xx.jpg');

background-size:cover;

background-position:center;

border-radius:50%;

border:4px solid white;

margin-bottom:15px;

}



header h1{

font-size:2.2rem;

margin:5px;

}


header p{

font-size:1.1rem;

}



.support-section{

max-width:1100px;

margin:-60px auto 40px;

padding:0 20px;

}



.support-grid{

display:grid;

grid-template-columns:repeat(auto-fit,minmax(300px,1fr));

gap:25px;

}



.support-item{

height:220px;

border-radius:15px;

overflow:hidden;

position:relative;

background-size:cover;

background-position:center;

}



.overlay{

position:absolute;

inset:0;

background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,.2));

}



.content{

position:absolute;

bottom:20px;

right:20px;

color:white;

}



.content h3{

color:#25D366;

}



.card{

background:#1a4332;

padding:35px;

border-radius:25px;

box-shadow:0 20px 45px rgba(0,0,0,.4);

margin-top:40px;

}



h2{

color:white;

text-align:center;

}


.form-group{

margin-bottom:18px;

}


label{

display:block;

color:white;

font-weight:bold;

margin-bottom:8px;

}



input,
select,
textarea{

width:100%;

padding:14px;

border:0;

border-radius:12px;

font-size:16px;

background:#f8f9fa;

}



button{

width:100%;

padding:18px;

background:linear-gradient(to right,#25D366,#128C7E);

color:white;

border:0;

border-radius:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



.note{

background:#fff9cd;

color:#856404;

padding:12px;

border-radius:12px;

text-align:center;

margin-bottom:20px;

}


</style>

</head>


<body>

<header>

<div class="logo"></div>

<h1>
مؤسسة الوليد للمعدات
</h1>

<p>
طلب قطع الغيار والمعدات
</p>

</header>




<section class="support-section">



<div class="support-grid">



<div class="support-item" style="background-image:url('images/de.jpg');">

<div class="overlay"></div>

<div class="content">

<h3>قطع غيار</h3>

<p>
نوفر طلبات قطع الغيار والمعدات.
</p>

</div>

</div>





<div class="support-item" style="background-image:url('images/ds.jpg');">

<div class="overlay"></div>

<div class="content">

<h3>معدات</h3>

<p>
طلبات المعدات المختلفة.
</p>

</div>

</div>





<div class="support-item" style="background-image:url('images/dx.jpg');">

<div class="overlay"></div>

<div class="content">

<h3>خدمات أخرى</h3>

<p>
حلول وتجهيزات حسب الطلب.
</p>

</div>

</div>


</div>







<div class="card">



<h2>
تسجيل طلب جديد
</h2>



<div class="note">

💡 بعد إرسال الطلب سيتم إنشاء رقم معاملة لمتابعته لاحقاً.

</div>





<div class="form-group">

<label>
الاسم الكامل:
</label>

<input 
id="name"
type="text"
placeholder="الاسم">

</div>





<div class="form-group">

<label>
رقم الجوال:
</label>

<input 
id="phone"
type="tel"
placeholder="مع مفتاح الدولة">

</div>





<div class="form-group">

<label>
البريد الإلكتروني:
</label>

<input 
id="email"
type="email"
placeholder="example@gmail.com">

</div>





<div class="form-group">

<label>
رقم الهوية:
</label>

<input 
id="idNumber"
type="text"
placeholder="رقم الهوية">

</div>





<div class="form-group">

<label>
رقم القطعة:
</label>

<input 
id="partNumber"
type="text"
placeholder="رقم القطعة المطلوبة">

</div>




<div class="form-group">

<label>
الدولة:
</label>

<input 
id="country"
type="text"
placeholder="الدولة">

</div>




<div class="form-group">

<label>
نوع الطلب:
</label>


<select id="type">


<option value="">
اختر النوع
</option>


<option value="قطع غيار">
قطع غيار
</option>


<option value="معدات">
معدات
</option>


<option value="أخرى">
أخرى
</option>


</select>


</div>





<div class="form-group">

<label>
تفاصيل الطلب:
</label>


<textarea
id="notes"
rows="4"
placeholder="اكتب تفاصيل الطلب">
</textarea>


</div>





<button id="sendBtn">

إرسال الطلب

</button>


</div>


</section>

<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore,
collection,
addDoc,
serverTimestamp

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";




// إعدادات Firebase الخاصة بمشروعك

const firebaseConfig = {


apiKey: "AIzaSyDD_I84b3b6bmVkjVx-t2g7Cbd6RPcYz_Q",

authDomain: "sparepartswebsite1.firebaseapp.com",

projectId: "sparepartswebsite1",

storageBucket: "sparepartswebsite1.firebasestorage.app",

messagingSenderId: "1063114847735",

appId: "1:1063114847735:web:0e764c150ab10df2d82af2"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);







document.getElementById("sendBtn").onclick = async function(){



const name =
document.getElementById("name").value.trim();



const phone =
document.getElementById("phone").value.trim();



const email =
document.getElementById("email").value.trim();



const idNumber =
document.getElementById("idNumber").value.trim();



const partNumber =
document.getElementById("partNumber").value.trim();



const country =
document.getElementById("country").value.trim();



const type =
document.getElementById("type").value;



const notes =
document.getElementById("notes").value.trim();







if(
!name ||
!phone ||
!email ||
!idNumber ||
!partNumber ||
!country ||
!type ||
!notes

){


alert("يرجى تعبئة جميع البيانات");

return;


}






// إنشاء رقم معاملة 4 أرقام

const transactionId =

Math.floor(1000 + Math.random() * 9000)

.toString();







try{



await addDoc(collection(db,"requests"),{


transactionId:transactionId,

name:name,

phone:phone,

email:email,

idNumber:idNumber,

partNumber:partNumber,

country:country,

type:type,

notes:notes,


status:"قيد المراجعة",

approved:false,

createdAt:serverTimestamp()


});





// حفظ البيانات لصفحة النجاح

sessionStorage.setItem("transactionId",transactionId);

sessionStorage.setItem("name",name);

sessionStorage.setItem("phone",phone);

sessionStorage.setItem("email",email);

sessionStorage.setItem("idNumber",idNumber);

sessionStorage.setItem("partNumber",partNumber);

sessionStorage.setItem("country",country);

sessionStorage.setItem("type",type);

sessionStorage.setItem("notes",notes);






// الانتقال لصفحة النجاح

window.location.href="success.html";






}

catch(error){


console.log(error);


alert("حدث خطأ أثناء إرسال الطلب");


}



};



</script>

</body>

</html>
