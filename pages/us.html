<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تم إرسال الطلب</title>


<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Cairo',sans-serif;
}


body{

background:#f4f5f7;

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}



.container{

width:100%;

max-width:420px;

}



.card{

background:#fff;

border-radius:25px;

padding:25px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

text-align:center;

margin-top:50px;

}




.success-box{

background:#fff;

border-radius:20px;

padding:25px;

width:85%;

margin:-60px auto 25px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.icon{

width:65px;

height:65px;

background:#e8fff4;

border:3px solid #007c4b;

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:35px;

font-weight:bold;

color:#007c4b;

margin:-60px auto 15px;

}



h2{

font-size:20px;

color:#1b212c;

}



.text{

color:#6b7280;

font-size:15px;

line-height:1.8;

margin-bottom:20px;

}




.order-title{

font-weight:bold;

color:#1b212c;

margin-top:20px;

}



.order-box{

display:flex;

align-items:center;

justify-content:space-between;

border:1px solid #ddd;

border-radius:12px;

padding:15px;

margin-top:10px;

}



#transaction{

font-size:24px;

font-weight:bold;

color:#007c4b;

}



.copy-btn{

background:#eee;

border:0;

padding:8px 12px;

border-radius:8px;

cursor:pointer;

}



.warning{

background:#fff8df;

border:1px solid #d4af37;

border-radius:15px;

padding:15px;

margin-top:20px;

color:#6b4d00;

font-weight:bold;

font-size:14px;

}



.btn{

width:100%;

padding:15px;

border:0;

border-radius:12px;

font-size:16px;

font-weight:bold;

cursor:pointer;

margin-top:12px;

}



.track{

background:#007c4b;

color:white;

}



.whatsapp{

background:#25D366;

color:white;

}



.home{

background:#1b212c;

color:white;

}



</style>

</head>


<body>


<div class="container">


<div class="card">


<div class="success-box">


<div class="icon">

✓

</div>


<h2>

لقد تم رفع الطلب بنجاح

</h2>


</div>



<p class="text">

مرحباً بك عزيزي العميل

<br>

تم استلام طلبك بنجاح وسيتم مراجعته من قبل الإدارة.

</p>



<div class="order-title">

رقم المعاملة الخاص بك

</div>



<div class="order-box">


<div id="transaction">

----

</div>


<button class="copy-btn" onclick="copyNumber()">

📋 نسخ

</button>


</div>



<div class="warning">

⚠️ احتفظ برقم المعاملة لمتابعة حالة طلبك.

</div>


<button class="btn track" onclick="trackOrder()">

🔍 متابعة الطلب

</button>



<button class="btn whatsapp" onclick="sendWhatsApp()">

💬 إرسال عبر واتساب

</button>



<button class="btn home" onclick="goHome()">

العودة للرئيسية

</button>


</div>


</div>
<script>


// قراءة بيانات العميل

const transactionId =
sessionStorage.getItem("transactionId") || "----";


const name =
sessionStorage.getItem("name") || "";


const phone =
sessionStorage.getItem("phone") || "";


const email =
sessionStorage.getItem("email") || "";


const idNumber =
sessionStorage.getItem("idNumber") || "";


const partNumber =
sessionStorage.getItem("partNumber") || "";


const country =
sessionStorage.getItem("country") || "";


const type =
sessionStorage.getItem("type") || "";


const notes =
sessionStorage.getItem("notes") || "";




// عرض رقم المعاملة

document.getElementById("transaction").innerText = transactionId;






// نسخ رقم المعاملة

function copyNumber(){


navigator.clipboard.writeText(transactionId);


alert("تم نسخ رقم المعاملة: " + transactionId);


}







// إرسال واتساب

function sendWhatsApp(){



const adminPhone = "966580272758";



let message =

"📌 طلب جديد\n\n";



message += "رقم المعاملة: " + transactionId + "\n\n";

message += "الاسم: " + name + "\n";

message += "الجوال: " + phone + "\n";

message += "البريد: " + email + "\n";

message += "رقم الهوية: " + idNumber + "\n";

message += "رقم القطعة: " + partNumber + "\n";

message += "الدولة: " + country + "\n";

message += "نوع الطلب: " + type + "\n";

message += "التفاصيل: " + notes;



window.location.href =

"https://wa.me/" +

adminPhone +

"?text=" +

encodeURIComponent(message);



}








// متابعة الطلب

function trackOrder(){


window.location.href =

"track.html?transaction=" +

transactionId +

"&phone=" +

phone;


}







// العودة للرئيسية

function goHome(){


window.location.href="index.html";


}



</script>


</body>

</html>
