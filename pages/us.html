 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل طلب المساعدة</title>
</head>
<body>
  <h2>نموذج تسجيل الطلب</h2>
  <form id="orderForm">
    <label>الاسم:</label>
    <input type="text" id="name" required><br>

    <label>رقم الجوال:</label>
    <input type="tel" id="phone" required><br>

    <label>البريد الإلكتروني:</label>
    <input type="email" id="email" required><br>

    <label>رقم الهوية:</label>
    <input type="text" id="idNumber" required><br>

    <label>رقم القطعة:</label>
    <input type="text" id="accountNumber"><br>

    <label>الدولة:</label>
    <input type="text" id="country" required><br>

    <label>نوع المساعدة:</label>
    <select id="helpType" required>
      <option value="">-- اختر النوع --</option>
      <option value="قطع">قطع</option>
      <option value="سكنية">وحدات سكنية</option>
      <option value="سيارات">سيارات</option>
      <option value="أخرى">أخرى</option>
    </select><br>

    <label>شرح الحالة:</label>
    <textarea id="notes" rows="4" required></textarea><br>

    <button type="submit">إرسال الطلب</button>
  </form>

  <script type="module">
    // استدعاء مكتبات Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // إعدادات مشروعك
    const firebaseConfig = {
      apiKey: "AIzaSyCYxmV9J0KtnuMv1l8U5nJu-dqj6gLYujo",
      authDomain: "waleed-d28f4.firebaseapp.com",
      projectId: "waleed-d28f4",
      storageBucket: "waleed-d28f4.firebasestorage.app",
      messagingSenderId: "590481084112",
      appId: "1:590481084112:web:9b62b99f6b54c1990358d5"
    };

    // تشغيل Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // التعامل مع النموذج
    document.getElementById("orderForm").addEventListener("submit", async (e)=>{
      e.preventDefault();

      const transactionId = Math.floor(1000 + Math.random()*9000);

      try {
        await addDoc(collection(db,"requests"), {
          transactionId: String(transactionId),
          name: document.getElementById("name").value,
          phone: document.getElementById("phone").value,
          email: document.getElementById("email").value,
          idNumber: document.getElementById("idNumber").value,
          accountNumber: document.getElementById("accountNumber").value,
          country: document.getElementById("country").value,
          helpType: document.getElementById("helpType").value,
          notes: document.getElementById("notes").value,
          status: "قيد الانتظار",
          createdAt: serverTimestamp()
        });

        alert("تم تسجيل طلبك بنجاح. رقم معاملتك: "+transactionId);
      } catch(err){
        console.error(err);
        alert("حدث خطأ أثناء إرسال الطلب");
      }
    });
  </script>
</body>
</html>
