<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤسسة الوليد الإنسانية | طلب مساعدة</title>

  <style>
      @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');

:root {
    --header-bg-image: url('images/xx.jpg');
    --card-bg-dark: #1a4332;
    --input-bg-light: #f8f9fa;
    --text-on-dark: #FFFFFF;
    --accent-green: #25D366;
  }

  body {
    font-family: 'Cairo', Tahoma, sans-serif;
    margin: 0;
    padding: 0;
    background-color: #f0f2f5;
    color: #333;
    line-height: 1.6;
  }

  header {
    background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), var(--header-bg-image);
    background-size: cover;
    background-position: center;
    height: 40vh;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 20px;
  }

  .logo {
    width: 110px;
    height: 110px;
    background-color: #fff;
    background-image: var(--header-bg-image);
    background-size: cover;
    background-position: center;
    border-radius: 50%;
    border: 4px solid rgba(255,255,255,0.8);
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    margin-bottom: 15px;
  }

  header h1 {
    margin: 5px 0;
    font-size: 2.2rem;
  }

  header p {
    margin: 0;
    font-size: 1.1rem;
    opacity: 0.9;
  }

  .support-section {
    max-width: 1100px;
    margin: -60px auto 40px;
    padding: 0 20px;
  }

  .card {
    background-color: var(--card-bg-dark);
    padding: 35px;
    border-radius: 25px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.5);
  }

  h2 {
    color: var(--text-on-dark);
    text-align: center;
    margin-bottom: 25px;
  }

  /* ✅ تحسين شكل الحقول بالكامل */
  .form-group {
    margin-bottom: 12px; /* مسافة صغيرة بين الخانات */
  }

  label {
    display: block;
    color: var(--text-on-dark);
    font-size: 0.95rem;
    margin-bottom: 5px;
    font-weight: bold;
  }

  input, select, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15);
    background-color: var(--input-bg-light);
    font-size: 1rem;
    outline: none;
    transition: 0.3s;
    box-sizing: border-box;
  }

  input:focus,
  select:focus,
  textarea:focus {
    border: 1px solid #25D366;
    box-shadow: 0 0 8px rgba(37,211,102,0.3);
  }

  textarea {
    resize: none;
  }

  button {
    width: 100%;
    padding: 16px;
    background: linear-gradient(to right, #25D366, #128C7E);
    color: white;
    border: none;
    border-radius: 15px;
    font-size: 1.1rem;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.3s;
  }

  button:hover {
    transform: scale(1.02);
  }

  .main-footer {
    background-color: #0f172a;
    color: #f1f5f9;
    padding: 50px 20px 20px;
    border-top: 4px solid #38bdf8;
  }

  .footer-container {
    max-width: 1100px;
    margin: 0 auto;
    text-align: center;
  }

  .contact-links {
    display: flex;
    justify-content: center;
    gap: 30px;
    flex-wrap: wrap;
  }

  .contact-item {
    color: #94a3b8;
    text-decoration: none;
  }

  </style>
</head>

<body>

<header>
  <div class="logo"></div>
  <h1>مؤسسة الوليد الإنسانية</h1>
  <p>تقديم طلبات الدعم والمساعدة عالمياً</p>
</header>

<section class="support-section">

  <div class="card">

    <h2>طلب المساعدة</h2>

    <div class="form-group">
      <label>الاسم الكامل</label>
      <input id="name" placeholder="أدخل اسمك">
    </div>

    <div class="form-group">
      <label>رقم الجوال</label>
      <input id="phone" placeholder="مثال: 00966...">
    </div>

    <div class="form-group">
      <label>الدولة</label>
      <input id="location" placeholder="اختر دولتك">
    </div>

    <div class="form-group">
      <label>نوع المساعدة</label>
      <select id="type">
        <option>مالية</option>
        <option>سكنية</option>
        <option>سيارات</option>
      </select>
    </div>

    <div class="form-group">
      <label>تفاصيل الحالة</label>
      <textarea id="notes" rows="4" placeholder="اشرح حالتك"></textarea>
    </div>

    <button id="sendBtn">إرسال عبر واتساب</button>

  </div>

</section>

<footer class="main-footer">

  <div class="footer-container">

    <div class="contact-links">

      <a href="mailto:lamiamagedoffice1@gmail.com" class="contact-item">
        📧 البريد الإلكتروني
      </a>

      <a href="https://wa.me/966569872542" class="contact-item">
        💬 واتساب الدعم
      </a>

    </div>

  </div>

</footer>

<script>

document.getElementById("sendBtn").onclick = function () {

    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const location = document.getElementById("location").value;
    const type = document.getElementById("type").value;
    const notes = document.getElementById("notes").value;

    const adminPhone = "966569872542";

    let message =
`📌 طلب مساعدة جديد

الاسم: ${name}
الهاتف: ${phone}
الدولة: ${location}
النوع: ${type}
التفاصيل: ${notes}`;

    window.open("https://wa.me/" + adminPhone + "?text=" + encodeURIComponent(message));

};

</script>

</body>
</html>
