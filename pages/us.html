<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام متابعة المعاملات - تجريبي</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    font-family:'Cairo',sans-serif;
}

body{
    margin:0;
    background:#f5f7f6;
    color:#333;
}


/* تنبيه تجريبي */
.demo-alert{
    background:#fff3cd;
    color:#856404;
    text-align:center;
    padding:12px;
    font-weight:bold;
    border-bottom:1px solid #ffeeba;
    font-size:14px;
}


/* الهيدر */
.header{
    background:#008444;
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:24px;
}


/* الحاوية */
.container{

    width:90%;
    max-width:500px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:18px;
    box-shadow:0 8px 25px rgba(0,0,0,.1);

}


/* العناوين */

.title{
    text-align:center;
    color:#008444;
    font-size:22px;
    font-weight:800;
    margin-bottom:25px;
}


/* الحقول */

.input-group{
    margin-bottom:18px;
}


.input-group label{

    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#444;

}


.input-group input{

    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:16px;
    text-align:right;

}


.input-group input:focus{

    border-color:#008444;

}



/* زر */

.main-btn{

    width:100%;
    padding:15px;
    background:#008444;
    color:white;
    border:none;
    border-radius:30px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;

}


.main-btn:hover{

    background:#006d38;

}



/* صندوق النتيجة */

.result-box{

    display:none;
    margin-top:25px;
    background:#f8fff9;
    border:1px solid #b7e4c7;
    border-radius:15px;
    padding:20px;
    text-align:center;

}


.code-box{

    background:white;
    border:2px dashed #008444;
    border-radius:12px;
    padding:15px;
    font-size:28px;
    font-weight:800;
    color:#008444;
    letter-spacing:3px;
    margin:15px 0;

}



/* زر النسخ */

.copy-btn{

    background:#008444;
    color:white;
    border:none;
    padding:12px 30px;
    border-radius:25px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;

}


.copy-btn:active{

    transform:scale(.96);

}


.footer-note{

    text-align:center;
    color:#777;
    font-size:13px;
    margin-top:20px;

}


</style>

</head>

<body>


<div class="demo-alert">

⚠️ موقع تجريبي للتدريب والمحاكاة فقط - ليس نظاماً مالياً حقيقياً

</div>


<div class="header">

<h1>
نظام متابعة المعاملات
</h1>

</div>


<div class="container">

<h2 class="title">
بيانات المستفيد
</h2>


<div class="input-group">

<label>
الاسم الكامل
</label>

<input type="text" id="name" placeholder="اكتب الاسم">

</div>


<div class="input-group">

<label>
رقم الهوية
</label>

<input type="text" id="idNumber" placeholder="اكتب رقم الهوية">

</div>


<div class="input-group">

<label>
رقم الجوال
</label>

<input type="tel" id="phone" placeholder="اكتب رقم الجوال">

</div>


<button class="main-btn" onclick="generateCode()">

تأكيد البيانات

</button>


<div class="result-box" id="result">


<h3>
تم إنشاء رمز المعاملة التجريبي
</h3>


<div class="code-box" id="transactionCode">

</div>


<button class="copy-btn" onclick="copyCode()">

نسخ الكود

</button>


<p class="footer-note">
احتفظ بالرمز لاستخدامه في صفحة المتابعة التجريبية
</p>


</div>


</div>
<script>


// إنشاء رمز معاملة تجريبي (حرف + 4 أرقام)
function generateCode(){

    let name = document.getElementById("name").value.trim();
    let idNumber = document.getElementById("idNumber").value.trim();
    let phone = document.getElementById("phone").value.trim();


    if(name === "" || idNumber === "" || phone === ""){

        alert("يرجى تعبئة جميع البيانات");
        return;

    }



    // حرف عشوائي + 4 أرقام
    let letter = String.fromCharCode(
        65 + Math.floor(Math.random() * 26)
    );


    let numbers = Math.floor(
        1000 + Math.random() * 9000
    );


    let code = letter + numbers;



    // حفظ بيانات تجريبية داخل المتصفح
    localStorage.setItem(
        "demoTransaction",
        JSON.stringify({

            name:name,
            id:idNumber,
            phone:phone,
            code:code

        })
    );



    document.getElementById("transactionCode").innerText = code;


    document.getElementById("result").style.display="block";


}



// نسخ الكود للحافظة
function copyCode(){

    let code =
    document.getElementById("transactionCode").innerText;


    navigator.clipboard.writeText(code)
    .then(function(){

        alert("تم نسخ رمز المعاملة: " + code);

    })
    .catch(function(){

        alert("تعذر النسخ، قم بالنسخ يدوياً");

    });


}


</script>
<!-- صفحة التحقق التجريبية -->

<div class="container" style="margin-top:40px;">

<h2 class="title">
متابعة المعاملة
</h2>


<div class="input-group">

<label>
رقم الهوية
</label>

<input 
type="text" 
id="checkId" 
placeholder="أدخل رقم الهوية">

</div>



<div class="input-group">

<label>
رمز المعاملة
</label>

<input 
type="text" 
id="checkCode" 
placeholder="مثال A1234">

</div>



<button class="main-btn" onclick="checkTransaction()">

متابعة الحالة

</button>



<div 
class="result-box" 
id="checkResult"
>

</div>


</div>



<script>


function checkTransaction(){


let savedData = localStorage.getItem("demoTransaction");


let resultBox =
document.getElementById("checkResult");


if(!savedData){

    resultBox.style.display="block";

    resultBox.innerHTML =
    `
    <h3 style="color:#d9534f">
    لا توجد معاملة تجريبية محفوظة
    </h3>
    `;

    return;

}



let data = JSON.parse(savedData);



let enteredId =
document.getElementById("checkId").value.trim();


let enteredCode =
document.getElementById("checkCode").value.trim()
.toUpperCase();



if(
enteredId === data.id &&
enteredCode === data.code
){


resultBox.style.display="block";


resultBox.innerHTML =

`

<h3 style="color:#008444">

تم التحقق بنجاح ✓

</h3>


<p>

اسم المستفيد:
<br>

<b>${data.name}</b>

</p>


<p>

رمز المعاملة:
<br>

<b style="color:#008444;font-size:22px">

${data.code}

</b>

</p>


<p>

حالة الطلب:
<br>

<span style="color:#e6a700;font-weight:bold">

قيد المراجعة (تجريبي)

</span>

</p>


`;


}

else{


resultBox.style.display="block";


resultBox.innerHTML =

`

<h3 style="color:#d9534f">

بيانات غير صحيحة

</h3>


<p>

تأكد من رقم الهوية ورمز المعاملة

</p>

`;

}


}



</script>


</body>

</html>
