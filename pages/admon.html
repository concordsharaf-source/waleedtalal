<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
doc,
updateDoc,
deleteDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";


const firebaseConfig = {

apiKey: "AIzaSyDD_I84b3b6bmVkjVx-t2g7Cbd6RPcYz_Q",

authDomain: "sparepartswebsite1.firebaseapp.com",

projectId: "sparepartswebsite1",

storageBucket: "sparepartswebsite1.firebasestorage.app",

messagingSenderId: "1063114847735",

appId: "1:1063114847735:web:0e764c150ab10df2d82af2"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const CUSTOM_STATUS_VALUE="__custom__";

window.toggleCustomStatus=function(shouldFocus=false){
const select=document.getElementById("editStatus");
const wrap=document.getElementById("customStatusWrap");
const input=document.getElementById("editCustomStatus");
const isCustom=select.value===CUSTOM_STATUS_VALUE;
wrap.hidden=!isCustom;
if(isCustom && shouldFocus)input.focus();
};

function setEditableStatus(status){
const select=document.getElementById("editStatus");
const input=document.getElementById("editCustomStatus");
const value=String(status || "قيد المراجعة").trim() || "قيد المراجعة";
const isKnown=Array.from(select.options).some(option=>
option.value===value && option.value!==CUSTOM_STATUS_VALUE
);

if(isKnown){
select.value=value;
input.value="";
}else{
select.value=CUSTOM_STATUS_VALUE;
input.value=value;
}

window.toggleCustomStatus(false);
}

function getEditableStatus(){
const select=document.getElementById("editStatus");
if(select.value!==CUSTOM_STATUS_VALUE)return select.value;

const input=document.getElementById("editCustomStatus");
const value=input.value.trim();
if(!value){
alert("اكتب الحالة المخصصة أولاً");
input.focus();
return null;
}
return value;
}

/* توحيد الأرقام العربية والفارسية والإنجليزية قبل البحث أو الحفظ. */
function normalizeNumber(value){
return String(value ?? "")
.replace(/[٠-٩]/g,function(d){
return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
})
.replace(/[۰-۹]/g,function(d){
return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
})
.replace(/[^0-9]/g,"");
}

function normalizePhone(value){
let phone=normalizeNumber(value);
return phone.startsWith("00") ? phone.slice(2) : phone;
}


let allOrders=[];
let ordersLoaded=false;
let ordersListenerReady=false;
let accessNotificationTimer=null;


const ordersDiv=document.getElementById("orders");
const accessNotification=document.getElementById("accessNotification");

function esc(v){return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function fmtDate(ts){
try{
if(!ts) return "-";
let d;
if(ts.seconds) d=new Date(ts.seconds*1000);
else if(typeof ts.toDate==="function") d=ts.toDate();
else d=new Date(ts);
if(isNaN(d.getTime())) return "-";
const p=n=>String(n).padStart(2,"0");
return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}catch(e){return "-";}
}

function logTimestamp(log){
const date=new Date(log?.clientTime || 0);
return isNaN(date.getTime()) ? 0 : date.getTime();
}

function logsForOrder(order){
return (Array.isArray(order.trackingLogs) ? [...order.trackingLogs] : [])
.sort((a,b)=>logTimestamp(b)-logTimestamp(a));
}

function trackingCounts(order){
const logs=logsForOrder(order);
const logSuccess=logs.filter(log=>log.result==="success").length;
const logFailed=logs.length-logSuccess;
const successful=Number.isFinite(Number(order.trackingSuccessCount))
? Number(order.trackingSuccessCount)
: logSuccess;
const failed=Number.isFinite(Number(order.trackingFailedCount))
? Number(order.trackingFailedCount)
: logFailed;
const total=Number.isFinite(Number(order.trackingAttemptCount))
? Number(order.trackingAttemptCount)
: successful+failed;
return {total,successful,failed,logs};
}

function renderAccessLogItem(log){
const success=log.result==="success";
return `
<div class="access-log-item ${success ? "" : "failed"}">
<div class="log-head">
<strong>${success ? "✅ دخول ناجح" : "⚠️ محاولة فاشلة"}</strong>
<span>${fmtDate(log.clientTime)}</span>
</div>
<div class="log-meta">
${esc(log.device) || "جهاز غير معروف"} •
${esc(log.browser) || "متصفح غير معروف"} •
${esc(log.os) || "نظام غير معروف"}
</div>
</div>`;
}

function renderOrderAccessLogs(order){
const {total,successful,failed,logs}=trackingCounts(order);

if(!total){
return `
<details class="access-log-box">
<summary>
<span>👁️ لم يتم الدخول من صفحة التتبع حتى الآن</span>
<span class="access-count">0 مرة</span>
</summary>
<div class="access-empty">لا يوجد سجل دخول لهذه المعاملة.</div>
</details>`;
}

return `
<details class="access-log-box">
<summary>
<span>👁️ الدخول الناجح من صفحة التتبع: ${successful} مرة</span>
<span class="access-count">الإجمالي ${total} • فاشل ${failed}</span>
</summary>
<div class="access-log-list">
${logs.length
? logs.map(log=>renderAccessLogItem(log)).join("")
: '<div class="access-empty">لا تتوفر تفاصيل المحاولات القديمة.</div>'}
</div>
</details>`;
}

function rerenderCurrentOrders(){
if(!ordersLoaded)return;
const search=document.getElementById("searchInput").value.trim();
if(search){
window.searchOrders();
}else{
displayOrders(allOrders);
}
}

function showAccessNotification(order,log){
clearTimeout(accessNotificationTimer);
const success=log?.result==="success";
const transactionId=String(order?.transactionId || "غير محدد");
accessNotification.classList.toggle("failed",!success);
accessNotification.textContent=success
? `✅ تم الدخول للمعاملة ${transactionId} من صفحة التتبع`
: `⚠️ محاولة تتبع فاشلة للمعاملة ${transactionId}`;
accessNotification.hidden=false;
accessNotificationTimer=setTimeout(()=>{
accessNotification.hidden=true;
},5000);
}

function listenToOrders(){
onSnapshot(
collection(db,"orders"),
snapshot=>{
const previousCounts=new Map(
allOrders.map(order=>[order.id,trackingCounts(order).total])
);

const updatedOrders=snapshot.docs.map(item=>({id:item.id,...item.data()}));
updatedOrders.sort((a,b)=>(b.createdAt?.seconds || 0)-(a.createdAt?.seconds || 0));
allOrders=updatedOrders;
ordersLoaded=true;
rerenderCurrentOrders();

if(ordersListenerReady){
const changed=snapshot.docChanges()
.filter(change=>change.type==="modified")
.map(change=>({id:change.doc.id,...change.doc.data()}))
.find(order=>trackingCounts(order).total>(previousCounts.get(order.id) || 0));

if(changed){
showAccessNotification(changed,logsForOrder(changed)[0]);
}
}
ordersListenerReady=true;
},
error=>{
console.log(error);
ordersDiv.innerHTML="حدث خطأ في تحميل الطلبات";
}
);
}


function displayOrders(list){


ordersDiv.innerHTML="";


if(list.length===0){

ordersDiv.innerHTML=
"<div class='order-card'>لا توجد طلبات</div>";

return;

}



list.forEach(data=>{


ordersDiv.innerHTML += `

<div class="order-card">


<div class="order-title">

<div class="t-block">
<div class="t-label">رقم المعاملة</div>
<span>${esc(data.transactionId) || "-"}</span>
</div>

<div class="t-block t-date">
<div class="t-label">📅 تاريخ تقديم الطلب</div>
<span class="date-value">${fmtDate(data.createdAt)}</span>
</div>

</div>


<div class="grid">


<div class="field">
<div class="label">الاسم</div>
<div class="value">${esc(data.name) || "-"}</div>
</div>


<div class="field">
<div class="label">الجوال</div>
<div class="value">${esc(data.phone) || "-"}</div>
</div>


<div class="field">
<div class="label">البريد الإلكتروني</div>
<div class="value">${esc(data.email) || "-"}</div>
</div>


<div class="field">
<div class="label">رقم الهوية</div>
<div class="value">${esc(data.idNumber) || "-"}</div>
</div>


<div class="field">
<div class="label">اسم البنك</div>
<div class="value">${esc(data.bankName) || "-"}</div>
</div>


<div class="field">
<div class="label">رقم الحساب / الآيبان</div>
<div class="value" style="word-break:break-all;">${esc(data.partNumber) || "-"}</div>
</div>


<div class="field">
<div class="label">الدولة</div>
<div class="value">${esc(data.country) || "-"}</div>
</div>


<div class="field">
<div class="label">نوع الطلب</div>
<div class="value">${esc(data.type) || "-"}</div>
</div>


<div class="field">
<div class="label">الحالة</div>
<div class="value">${esc(data.status) || "-"}</div>
</div>


<div class="field">
<div class="label">المنحة</div>
<div class="value">${esc(data.grantAmount) || "غير محدد"}</div>
</div>


<div class="field" style="grid-column:1/-1;">
<div class="label">تفاصيل الطلب (سجلها المستفيد)</div>
<div class="value" style="white-space:pre-wrap;font-weight:500;">${esc(data.notes) || "-"}</div>
</div>


</div>

${renderOrderAccessLogs(data)}

<div class="order-actions">

<button class="edit-btn"
onclick="openEdit('${data.id}')">

✏️ تعديل الطلب

</button>

<button class="delete-btn"
onclick="deleteOrder('${data.id}', this)">

🗑️ حذف المعاملة

</button>

</div>


</div>

`;

});


}





window.openEdit=function(id){


let order=allOrders.find(x=>x.id===id);


if(!order)return;



editId.value=id;

editName.value=order.name || "";

editPhone.value=order.phone || "";

editEmail.value=order.email || "";

editIdNumber.value=order.idNumber || "";

editCountry.value=order.country || "";

editBankName.value=order.bankName || "";
editPartNumber.value=order.partNumber || "";

editType.value=order.type || "";

setEditableStatus(order.status);

editNotes.value=order.notes || "";

editGrantAmount.value=order.grantAmount || "";

editApproved.value=String(order.approved || false);



editModal.style.display="flex";


}





window.closeEdit=function(){

editModal.style.display="none";

}


/* حذف نهائي مع رسالة تأكيد واضحة لمنع الضغط غير المقصود. */
window.deleteOrder=async function(id,button){

const order=allOrders.find(item=>item.id===id);
if(!order)return;

const transactionId=String(order.transactionId || "غير محدد");
const customerName=String(order.name || "بدون اسم");

const confirmed=window.confirm(
"هل أنت متأكد من حذف هذه المعاملة نهائياً؟\n\n"+

window.saveEdit=async function(){


let id=editId.value;
const statusValue=getEditableStatus();
if(statusValue===null)return;


try{


await updateDoc(

doc(db,"orders",id),

{


name:editName.value,

phone:normalizePhone(editPhone.value),

email:editEmail.value,

idNumber:editIdNumber.value,

country:editCountry.value,

bankName:editBankName.value,
partNumber:editPartNumber.value,

type:editType.value,

status:statusValue,

notes:editNotes.value,

editGrantAmount.value,

editApproved.value==="true"


}

);

}

catch(error){

alert("حدث خطأ أثناء الحفظ");

}


}




window.searchOrders=function(){


let text=searchInput.value.trim();



if(text===""){

displayOrders(allOrders);

return;

}



const normalizedText=text.toLowerCase();
const numericText=normalizeNumber(text);
const phoneText=normalizePhone(text);

let result=allOrders.filter(item=>{

const matchesNumbers = numericText !== "" && (
normalizeNumber(item.transactionId).includes(numericText)
||
(phoneText !== "" && normalizePhone(item.phone).includes(phoneText))
||
normalizeNumber(item.idNumber).includes(numericText)
||
normalizeNumber(item.partNumber).includes(numericText)
);

const matchesText =
String(item.name ?? "").toLowerCase().includes(normalizedText)
||
String(item.email ?? "").toLowerCase().includes(normalizedText)
||
String(item.bankName ?? "").toLowerCase().includes(normalizedText);

return matchesNumbers || matchesText;


});


displayOrders(result);


}





window.sortOrders=function(){


let type=sortSelect.value;



if(type==="new"){

allOrders.sort((a,b)=>

(b.createdAt?.seconds || 0)
-
(a.createdAt?.seconds || 0)

);

}


if(type==="old"){

allOrders.sort((a,b)=>

(a.createdAt?.seconds || 0)
-
(b.createdAt?.seconds || 0)

);

}


displayOrders(allOrders);


}



listenToOrders();
