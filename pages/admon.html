<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
doc,
updateDoc,
deleteDoc,
onSnapshot
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import { formatAmount, attachAmountFormatting } from "../scripts/amount-format.js";
import { detectNoteValues, buildNoteText } from "../scripts/note-tools.js";

attachAmountFormatting(document.getElementById("editGrantAmount"));

/* ---------------- تحديث سريع لمحتوى «تفاصيل الطلب» ----------------
 * ثلاثة حقول أعلى النص: رقم التواصل، مبلغ الرسوم، نوع الرسوم.
 * أي تغيير فيها ينعكس فوراً داخل نص التفاصيل. */
const notesField = document.getElementById("editNotes");
const noteInputs = {
    phone: document.getElementById("noteContactPhone"),
    amount: document.getElementById("noteFeesAmount"),
    feeType: document.getElementById("noteFeesType")
};

attachAmountFormatting(noteInputs.amount);

/* عند لمس أي خانة من الخانات الثلاث يُحدَّد نصها كاملاً،
   فيكفي كتابة القيمة الجديدة مباشرة دون تحديد وحذف يدوي.
   نمنع المتصفح من إلغاء التحديد عند إفلات زر الفأرة،
   ونترك النقرات التالية تعمل بشكل طبيعي لتعديل جزء من النص. */
function attachSelectAllOnFocus(input) {
    if (!input) return;
    let pending = false;

    input.addEventListener("focus", function () {
        pending = true;
        this.select();
    });

    input.addEventListener("mouseup", function (event) {
        if (!pending) return;
        event.preventDefault();
        pending = false;
        this.select();
    });

    input.addEventListener("touchend", function () {
        if (!pending) return;
        pending = false;
        this.select();
    });

    input.addEventListener("blur", function () {
        pending = false;
    });
}

Object.values(noteInputs).forEach(attachSelectAllOnFocus);

let noteState = { base: "", phone: "", amount: "", feeType: "" };

/* نلتقط القيم الموجودة فعلياً في النص عند فتح النافذة أو تعديل النص يدوياً. */
function captureNoteState() {
    const text = notesField.value;
    const detected = detectNoteValues(text);
    noteState = { base: text, ...detected };
    noteInputs.phone.value = detected.phone;
    noteInputs.amount.value = formatAmount(detected.amount);
    noteInputs.feeType.value = detected.feeType;
}

function currentNoteValues() {
    return {
        phone: noteInputs.phone.value,
        amount: formatAmount(noteInputs.amount.value),
        feeType: noteInputs.feeType.value
    };
}

/* نعيد بناء النص من الأساس في كل تغيير، فلا تتراكم القيم ولا تتكرر. */
function refreshNoteText() {
    const values = currentNoteValues();
    if (noteInputs.amount.value !== values.amount) noteInputs.amount.value = values.amount;
    notesField.value = buildNoteText(noteState.base, noteState, values);
}

Object.values(noteInputs).forEach(input => {
    input.addEventListener("input", refreshNoteText);
    input.addEventListener("blur", refreshNoteText);
});

/* التعديل اليدوي في النص يعيد ضبط الحقول الثلاثة لتطابقه. */
notesField.addEventListener("input", captureNoteState);


const firebaseConfig = {

apiKey: "AIzaSyDD_I84b3b6bmVkjVx-t2g7Cbd6RPcYz_Q",

authDomain: "sparepartswebsite1.firebaseapp.com",

projectId: "sparepartswebsite1",

storageBucket: "sparepartswebsite1.firebasestorage.app",

messagingSenderId: "1063114847735",

appId: "1:1063114847735:web:0e764c150ab10df2d82af2"

};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const CUSTOM_STATUS_VALUE="__custom__";

window.toggleCustomStatus=function(shouldFocus=false){
const select=document.getElementById("editStatus");
const wrap=document.getElementById("customStatusWrap");
const input=document.getElementById("editCustomStatus");
const isCustom=select.value===CUSTOM_STATUS_VALUE;
wrap.hidden=!isCustom;
if(isCustom && shouldFocus)input.focus();
};

function setEditableStatus(status){
const select=document.getElementById("editStatus");
const input=document.getElementById("editCustomStatus");
const value=String(status || "قيد المراجعة").trim() || "قيد المراجعة";
const isKnown=Array.from(select.options).some(option=>
option.value===value && option.value!==CUSTOM_STATUS_VALUE
);

if(isKnown){
select.value=value;
input.value="";
}else{
select.value=CUSTOM_STATUS_VALUE;
input.value=value;
}

window.toggleCustomStatus(false);
}

function getEditableStatus(){
const select=document.getElementById("editStatus");
if(select.value!==CUSTOM_STATUS_VALUE)return select.value;

const input=document.getElementById("editCustomStatus");
const value=input.value.trim();
if(!value){
alert("اكتب الحالة المخصصة أولاً");
input.focus();
return null;
}
return value;
}

/* توحيد الأرقام العربية والفارسية والإنجليزية قبل البحث أو الحفظ. */
function normalizeNumber(value){
return String(value ?? "")
.replace(/[٠-٩]/g,function(d){
return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
})
.replace(/[۰-۹]/g,function(d){
return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
})
.replace(/[^0-9]/g,"");
}

function normalizePhone(value){
let phone=normalizeNumber(value);
return phone.startsWith("00") ? phone.slice(2) : phone;
}

/* مقارنة أرقام الجوال بغض النظر عن صيغة البداية:
   +966580272758 / 00966580272758 / 0580272758  كلها تُطابق بعضها. */
function phoneVariants(value){
const raw=normalizePhone(value);
if(!raw) return [];
const variants=new Set([raw]);
const stripLeadingZero=raw.replace(/^0+/,"");
if(stripLeadingZero) variants.add(stripLeadingZero);
const withoutCountry=stripLeadingZero.replace(/^(966|967|971|965|973|974|968|962|20|212|213|216|218|249|964|961|963|970|962)/,"");
if(withoutCountry) variants.add(withoutCountry);
return [...variants];
}

function phonesMatch(query, value){
const queryVariants=phoneVariants(query);
if(!queryVariants.length) return false;
const valueVariants=phoneVariants(value);
return queryVariants.some(q=>valueVariants.some(v=>v.includes(q) || q.includes(v)));
}

/* تطبيع نص البحث: توحيد الحروف العربية (أ/إ/آ ← ا، ى ← ي، ة ← ه)،
   إزالة التشكيل والتطويل، وحذف علامات الترقيم والمسافات الزائدة. */
function normalizeArabicText(value){
return String(value ?? "")
.replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g,"")
.replace(/\u0640/g,"")
.replace(/[أإآٱ]/g,"ا")
.replace(/ى/g,"ي")
.replace(/ة/g,"ه")
.replace(/ؤ/g,"و")
.replace(/ئ/g,"ي")
.replace(/[^\p{L}\p{N}]+/gu," ")
.replace(/\s+/g," ")
.trim()
.toLowerCase();
}

/* substring واحد لا يكفي: يمزّق صيغ الرقم الواحد.
   هنا نقارَن «مقطع من رقم البحث» بعضو من أعضاء الرقم المسجّل. */
function digitsMatch(queryDigits, valueDigits){
const q=normalizeNumber(queryDigits);
const v=normalizeNumber(valueDigits);
if(!q) return false;
if(v.includes(q)) return true;
if(q.length < 4) return false;
return v.split(/\s+/).some(part=>part && q.includes(part));
}

function esc(v){return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function fmtDate(ts){
try{
if(!ts) return "-";
let d;
if(ts.seconds) d=new Date(ts.seconds*1000);
else if(typeof ts.toDate==="function") d=ts.toDate();
else d=new Date(ts);
if(isNaN(d.getTime())) return "-";
const p=n=>String(n).padStart(2,"0");
return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());
}catch(e){return "-";}
}

function logTimestamp(log){
const date=new Date(log?.clientTime || 0);
return isNaN(date.getTime()) ? 0 : date.getTime();
}

function logsForOrder(order){
return (Array.isArray(order.trackingLogs) ? [...order.trackingLogs] : [])
.sort((a,b)=>logTimestamp(b)-logTimestamp(a));
}

function trackingCounts(order){
const logs=logsForOrder(order);
const logSuccess=logs.filter(log=>log.result==="success").length;
const logFailed=logs.length-logSuccess;
const successful=Number.isFinite(Number(order.trackingSuccessCount))
? Number(order.trackingSuccessCount)
: logSuccess;
const failed=Number.isFinite(Number(order.trackingFailedCount))
? Number(order.trackingFailedCount)
: logFailed;
const total=Number.isFinite(Number(order.trackingAttemptCount))
? Number(order.trackingAttemptCount)
: successful+failed;
return {total,successful,failed,logs};
}

function friendlyTrackingDeviceModel(model){
const raw=String(model || "").trim();
const code=raw.toUpperCase();
const knownModels=[
[/^SM-S938/,"Galaxy S25 Ultra"],[/^SM-S936/,"Galaxy S25+"],[/^SM-S931/,"Galaxy S25"],
[/^SM-S928/,"Galaxy S24 Ultra"],[/^SM-S926/,"Galaxy S24+"],[/^SM-S921/,"Galaxy S24"],
[/^SM-S918/,"Galaxy S23 Ultra"],[/^SM-S916/,"Galaxy S23+"],[/^SM-S911/,"Galaxy S23"],
[/^SM-S908/,"Galaxy S22 Ultra"],[/^SM-S906/,"Galaxy S22+"],[/^SM-S901/,"Galaxy S22"],
[/^SM-F956/,"Galaxy Z Fold6"],[/^SM-F741/,"Galaxy Z Flip6"],
[/^SM-F946/,"Galaxy Z Fold5"],[/^SM-F731/,"Galaxy Z Flip5"]
];
const match=knownModels.find(([pattern])=>pattern.test(code));
return match ? match[1]+" ("+raw+")" : raw;
}

function trackingDeviceModel(log){
const saved=String(log?.deviceModel || "").trim();
if(saved)return friendlyTrackingDeviceModel(saved);
const ua=String(log?.userAgent || "");
const androidBuild=ua.match(/Android[^;)]*;\s*([^;)]+?)\s+Build\//i);
if(androidBuild && !/^(K|wv)$/i.test(androidBuild[1].trim()))return friendlyTrackingDeviceModel(androidBuild[1]);
if(/iphone/i.test(ua))return "iPhone";
if(/ipad/i.test(ua))return "iPad";
if(/ipod/i.test(ua))return "iPod";
return "";
}

function trackingDeviceBrand(log,model){
const saved=String(log?.deviceBrand || "").trim();
if(saved)return saved;
const source=(model+" "+String(log?.userAgent || "")).toLowerCase();
if(/\b(sm-|gt-|samsung)/i.test(model+" "+String(log?.userAgent || "")))return "Samsung";
if(/\bpixel\b/.test(source))return "Google";
if(/huawei|\b(ele|vog|noh|lio|ana|jny)-/i.test(source))return "Huawei";
if(/honor/i.test(source))return "Honor";
if(/redmi|poco|xiaomi|\bmi\s/i.test(source))return "Xiaomi";
if(/oneplus/i.test(source))return "OnePlus";
if(/oppo|\bcph\d/i.test(source))return "OPPO";
if(/realme|\brmx\d/i.test(source))return "realme";
if(/vivo/i.test(source))return "vivo";
if(/motorola|\bmoto\b/i.test(source))return "Motorola";
if(/tecno/i.test(source))return "TECNO";
if(/infinix/i.test(source))return "Infinix";
if(/iphone|ipad|ipod/i.test(source))return "Apple";
return "";
}

const searchInputEl=document.getElementById("searchInput");
const searchClearBtn=document.getElementById("searchClear");
const searchHintEl=document.getElementById("searchHint");

/* كل الحقول التي يُبحث فيها، مع اسم عربي يظهر داخل رسالة "تمت التصفية". */
const SEARCH_FIELDS=[
{key:"name", label:"الاسم", kind:"text"},
{key:"transactionId", label:"رقم المعاملة", kind:"digits"},
{key:"phone", label:"الجوال", kind:"phone"},
{key:"email", label:"البريد الإلكتروني", kind:"text"},
{key:"idNumber", label:"رقم الهوية", kind:"digits"},
{key:"partNumber", label:"رقم الحساب / الآيبان", kind:"digits"},
{key:"bankName", label:"اسم البنك", kind:"text"},
{key:"country", label:"الدولة", kind:"text"},
{key:"type", label:"نوع الطلب", kind:"text"},
{key:"status", label:"الحالة", kind:"text"}
];

/* ---------- تظليل الجزء المطابق داخل النص ---------- */
/* تطبيع «بطول ثابت» (كل حرف يبقى حرفاً واحداً) حتى تبقى مواضع التظليل صحيحة. */
function foldText(value){
return String(value ?? "")
.replace(/[\u0660-\u0669]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d))
.replace(/[\u06F0-\u06F9]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d))
.replace(/[أإآٱ]/g,"ا")
.replace(/ى/g,"ي")
.replace(/ة/g,"ه")
.replace(/ؤ/g,"و")
.replace(/ئ/g,"ي")
.replace(/\u0640/g,"")
.toLowerCase();
}

function highlightText(value, textQuery){
const safe=esc(value);
if(!textQuery) return safe;
const raw=String(value ?? "");
if(!raw) return safe;
const hay=foldText(raw);
if(hay.length!==raw.length) return safe;
const q=foldText(textQuery).trim();
if(!q) return safe;
const idx=hay.indexOf(q);
if(idx<0) return safe;
return esc(raw.slice(0,idx))+
"<mark>"+esc(raw.slice(idx,idx+q.length))+"</mark>"+
esc(raw.slice(idx+q.length));
}

function orderMatchesQuery(item, ctx){
if(!ctx.active) return true;
const nameNorm=normalizeArabicText(item.name);
const digits=ctx.digits;

const digitsReady = digits.length>=2;
const matchesName = ctx.text && nameNorm.includes(ctx.text);
const transactionRaw=String(item.transactionId ?? "").toLowerCase().replace(/\s+/g,"");
const matchesTransaction = Boolean(
(digitsReady && digitsMatch(digits, item.transactionId))
||
(ctx.transactionText && transactionRaw.includes(ctx.transactionText))
);
const matchesPhone = ctx.phoneRaw && phonesMatch(ctx.phoneRaw, item.phone);
const matchesEmail = ctx.text && String(item.email ?? "").toLowerCase().includes(ctx.text);
const matchesIdNumber = digitsReady && digitsMatch(digits, item.idNumber);
const matchesPartNumber = digitsReady && digitsMatch(digits, item.partNumber);

return Boolean(
matchesName
|| matchesTransaction
|| matchesPhone
|| matchesEmail
|| matchesIdNumber
|| matchesPartNumber
);
}

function matchedFieldLabels(item, ctx){
if(!ctx.active) return [];
const hits=[];
for(const field of SEARCH_FIELDS){
  const value=item[field.key];
  if(field.kind==="phone"){
    if(ctx.phoneRaw && phonesMatch(ctx.phoneRaw, value)) hits.push(field.label);
    continue;
  }
  if(field.kind==="digits"){
    const codeHit = field.key==="transactionId" && ctx.transactionText
      && String(value ?? "").toLowerCase().replace(/\s+/g,"").includes(ctx.transactionText);
    if((ctx.digits.length>=2 && digitsMatch(ctx.digits, value)) || codeHit) hits.push(field.label);
    continue;
  }
  if(ctx.text && normalizeArabicText(value).includes(ctx.text)) hits.push(field.label);
}
return hits;
}

function currentSearchContext(){
const text=searchInputEl.value.trim();
const normalized=normalizeArabicText(text);
return {
raw:text,
text:normalized,
digits:normalizeNumber(text),
transactionText:String(text).toLowerCase().replace(/\s+/g,""),
phoneRaw:normalizePhone(text),
active: text !== "" || normalizeNumber(text) !== ""
};
}

function updateSearchUi(result, ctx){
searchClearBtn.classList.toggle("visible", searchInputEl.value !== "");
if(!ordersLoaded || !ctx.active){
  searchHintEl.textContent="";
  searchHintEl.classList.remove("active");
  return;
}
const total=allOrders.length;
const totalLabel=total===1 ? "طلب واحد" : total+" طلبات";
searchHintEl.classList.add("active");
if(result.length===0){
  searchHintEl.innerHTML="لا توجد نتائج مطابقة لـ «"+esc(ctx.raw)+"» من أصل "+totalLabel+".";
}else if(result.length===total){
  searchHintEl.innerHTML="جميع الطلبات ("+totalLabel+") تطابق «"+esc(ctx.raw)+"».";
}else{
  searchHintEl.innerHTML="النتائج: "+result.length+" من "+totalLabel+" تطابق «"+esc(ctx.raw)+"».";
}
}

window.searchOrders=function(){
const ctx=currentSearchContext();
if(!ctx.active){
  displayOrders(allOrders);
  updateSearchUi(allOrders,ctx);
  return;
}
const result=allOrders.filter(item=>orderMatchesQuery(item,ctx));
displayOrders(result,ctx);
updateSearchUi(result,ctx);
return result;
};

if(type==="old"){

allOrders.sort((a,b)=>

(a.createdAt?.seconds || 0)
-
(b.createdAt?.seconds || 0)

);

}

}

<script>


async function checkPass(){

let p=document.getElementById("adminPass").value;
let errorElement=document.getElementById("passError");
errorElement.textContent="جاري التحقق...";

try{
const response=await fetch("/api/admin-notification-session",{
method:"POST",
headers:{"Content-Type":"application/json","Accept":"application/json"},
body:JSON.stringify({password:p})
});

if(!response.ok)throw new Error("invalid-password");
localStorage.setItem("adminLogin","yes");
document.getElementById("lockScreen").style.display="none";
errorElement.textContent="";
updateAdminNotificationBadge();
}catch(error){
errorElement.textContent="كلمة المرور خطأ";
}

}



if(localStorage.getItem("adminLogin")==="yes"){

document.getElementById("lockScreen").style.display="none";
updateAdminNotificationBadge();

}

async function updateAdminNotificationBadge(){
try{
const response=await fetch("/api/admin-notifications?limit=200",{cache:"no-store"});
if(!response.ok)return;
const data=await response.json();
const badge=document.getElementById("adminNotificationBadge");
const unread=Number(data.unreadCount || 0);
badge.textContent=unread>99 ? "99+" : String(unread);
badge.hidden=unread<1;
}catch(error){
console.warn("تعذر تحديث عداد الإشعارات",error);
}
}


function logout(){

localStorage.removeItem("adminLogin");
fetch("/api/admin-notification-session",{method:"DELETE",keepalive:true}).catch(()=>{});
location.reload();

}


</script>


<button onclick="logout()"
style="
margin:20px;
padding:12px;
border:none;
border-radius:10px;
background:#c0392b;
color:white;
font-weight:bold;
">

تسجيل خروج

</button>
