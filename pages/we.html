<script>
// فتح وإغلاق نافذة الواتساب
function toggleWhatsAppModal() {

    const modal = document.getElementById('whatsappModal');

    if (modal.style.display === 'none' || modal.style.display === '') {
        modal.style.display = 'flex';
    } else {
        modal.style.display = 'none';
    }
}

// إرسال الرسالة إلى الواتساب
function sendToWhatsApp() {

    const noteElement = document.getElementById('userNote');
    const note = noteElement.value.trim();

    // رقم الواتساب الجديد
    const phoneNumber = "966569872542";

    if (note === "") {
        alert("فضلاً اكتب الملاحظة أولاً");
        return;
    }

    const prefix =
        "📢 *رسالة جديدة من الموقع الرسمي:*\n\n";

    const suffix =
        "\n\nــــــــــــــــــــــــــــــــ\n⚠️ *يرجى النظر في مشكلتي وحلها في أسرع وقت.*";

    const fullMessage = prefix + note + suffix;

    const encodedText = encodeURIComponent(fullMessage);

    const whatsappUrl =
        "https://api.whatsapp.com/send?phone=" +
        phoneNumber +
        "&text=" +
        encodedText;

    window.open(whatsappUrl, '_blank');

    toggleWhatsAppModal();

    noteElement.value = "";
}
</script>
