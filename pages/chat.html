<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>المحادثة المباشرة | مؤسسة الوليد</title>
    <meta name="theme-color" content="#045652">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <link rel="icon" type="image/png" sizes="64x64" href="../icons/favicon-64.png">
    <link rel="apple-touch-icon" href="../icons/chat-app-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="واتساب الوليد">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="../chat-manifest.json?v=1">
    <link rel="preload" href="../fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/cairo-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../styles/chat.css?v=47">
    <script src="../scripts/pwa.js" defer></script>
</head>
<body>
    <section id="loginView" class="auth-page" aria-labelledby="loginTitle">
        <form id="chatLoginForm" class="auth-card">
            <img class="auth-logo" src="../images/chat-foundation-avatar.jpg" alt="شعار مؤسسة الوليد بن طلال الخيرية">
            <h1 id="loginTitle">الدردشة المباشرة</h1>
            <p class="auth-subtitle">أدخل رقم المعاملة ورقم الجوال المسجل للوصول إلى محادثتك مع الإدارة.</p>

            <label for="transactionInput">رقم المعاملة</label>
            <input id="transactionInput" inputmode="numeric" autocomplete="off" required placeholder="مثال: 1234">

            <label for="phoneInput">رقم الجوال</label>
            <input id="phoneInput" type="tel" inputmode="tel" autocomplete="tel" required placeholder="رقم الجوال المسجل في الطلب">

            <button id="loginButton" class="primary-button" type="submit">💬 دخول إلى المحادثة</button>
            <p id="loginError" class="auth-error" role="alert"></p>
            <a class="auth-back" href="../index.html">العودة إلى الصفحة الرئيسية</a>
        </form>
    </section>

    <main id="chatView" class="chat-shell" hidden>
        <div class="chat-top">
            <header class="chat-header">
                <button id="chatBackButton" class="icon-button" type="button" aria-label="رجوع" title="رجوع">➜</button>
                <img class="chat-avatar" src="../images/chat-foundation-avatar.jpg" alt="صورة حساب مؤسسة الوليد">
                <div class="chat-contact">
                    <strong>إدارة مؤسسة الوليد</strong>
                    <span id="adminStatus">جاري الاتصال...</span>
                </div>
                <span id="chatOrderBadge" class="order-badge">#----</span>
                <div class="header-actions">
                    <button id="messageSearchButton" class="icon-button" type="button" aria-label="البحث في المحادثة" title="بحث">🔍</button>
                    <button id="starredMessagesButton" class="icon-button" type="button" aria-label="الرسائل المميزة" title="الرسائل المميزة">☆</button>
                    <button id="notificationButton" class="icon-button notification-toggle needs-attention" type="button" aria-label="تفعيل الإشعارات" aria-pressed="false" title="تفعيل الإشعارات"><span class="notification-bell-icon" aria-hidden="true">🔔</span></button>
                    <button id="logoutButton" class="icon-button" type="button" aria-label="تسجيل الخروج" title="تسجيل الخروج">⇥</button>
                </div>
            </header>
            <div id="messageSearchBar" class="chat-search-bar" hidden>
                <input id="messageSearchInput" type="search" autocomplete="off" placeholder="البحث في الرسائل...">
                <span id="messageSearchCount" class="chat-search-count"></span>
                <button id="closeMessageSearch" class="icon-button" type="button" aria-label="إغلاق البحث">✕</button>
            </div>
        </div>

        <section id="messagesArea" class="messages-area" aria-live="polite">
            <div id="messagesList" class="messages-list">
                <div class="loading-chat">جاري تحميل المحادثة...</div>
            </div>
        </section>

        <div class="chat-floating-actions" aria-label="إجراءات المحادثة">
            <button id="installChatAppButton" class="install-chat-button" type="button" aria-label="تثبيت تطبيق المحادثة" title="تثبيت تطبيق المحادثة" data-page-install-button hidden>
                <span class="install-app-icon" aria-hidden="true">↓</span>
                <span class="install-app-label">تثبيت التطبيق</span>
            </button>
            <a id="floatingWhatsapp" class="optional-whatsapp" href="https://wa.me/966580272758" target="_blank" rel="noopener" aria-label="إرسال نموذج الطلب عبر واتساب" title="إرسال نموذج الطلب عبر واتساب">
                <img src="../icons/whatsapp.svg" alt="" aria-hidden="true">
            </a>
        </div>

        <footer class="composer-zone">
            <div id="typingBar" class="typing-bar" hidden>الإدارة تكتب الآن...</div>

            <div id="replyPreview" class="reply-preview" hidden>
                <div class="reply-preview-content">
                    <strong id="replySender"></strong>
                    <span id="replyText"></span>
                </div>
                <button id="cancelReplyButton" class="icon-button" type="button" aria-label="إلغاء الرد">✕</button>
            </div>

            <div id="emojiPanel" class="emoji-panel" hidden></div>

            <div id="voiceRecorder" class="voice-recorder" aria-live="polite" hidden>
                <div class="voice-lock-guide" aria-hidden="true">
                    <span class="voice-lock-icon"></span>
                    <span class="voice-lock-arrow">⌃</span>
                </div>
                <button id="cancelVoiceRecording" class="voice-control voice-cancel" type="button" aria-label="إلغاء التسجيل" title="إلغاء التسجيل">🗑</button>
                <div class="voice-recording-status">
                    <span class="voice-recording-dot" aria-hidden="true"></span>
                    <time id="voiceRecordingTimer" datetime="PT0S">00:00</time>
                </div>
                <div class="voice-live-wave" aria-label="موجات الصوت في الوقت الفعلي"></div>
                <span class="voice-slide-hint">اسحب للإلغاء</span>
                <button id="pauseVoiceRecording" class="voice-control voice-pause" type="button" aria-label="إيقاف التسجيل مؤقتًا" title="إيقاف مؤقت">⏸</button>
                <button id="sendVoiceRecording" class="send-button voice-record-send" type="button" aria-label="إرسال التسجيل">➤</button>
            </div>

            <form id="messageForm" class="composer">
                <div class="composer-input-shell">
                    <button id="emojiButton" class="icon-button composer-tool emoji-tool" type="button" aria-label="الرموز التعبيرية" title="الرموز التعبيرية"><span aria-hidden="true">☺</span></button>
                    <textarea id="messageInput" class="message-input" rows="1" maxlength="2500" placeholder="مراسلة" aria-label="نص الرسالة"></textarea>
                    <button id="attachmentButton" class="icon-button composer-tool attachment-button" type="button" aria-label="إرفاق ملف" title="إرفاق ملف">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.5 8.9 14.1a3 3 0 0 0 4.2 4.2l7.1-7.1a5 5 0 0 0-7.1-7.1L5.3 11.9a7 7 0 0 0 9.9 9.9l6.3-6.3"/></svg>
                    </button>
                    <button id="cameraButton" class="icon-button composer-tool camera-button" type="button" aria-label="فتح الكاميرا" title="الكاميرا">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.5 10 3h4l1.5 2.5H19a3 3 0 0 1 3 3V18a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8.5a3 3 0 0 1 3-3h3.5Z"/><circle cx="12" cy="13" r="4"/></svg>
                    </button>
                </div>
                <button id="sendButton" class="send-button composer-action-button is-voice" type="submit" aria-label="تسجيل رسالة صوتية" title="تسجيل رسالة صوتية"><span id="composerActionIcon" class="composer-action-icon" aria-hidden="true"></span></button>
            </form>
            <input id="chatMediaInput" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip" multiple hidden>
            <input id="chatCameraInput" type="file" accept="image/*" capture="environment" hidden>
            <div id="attachmentSheet" class="attachment-sheet" hidden>
                <button type="button" data-attachment="document"><span class="attachment-choice-icon document">▤</span><span>مستند</span></button>
                <button type="button" data-attachment="gallery"><span class="attachment-choice-icon gallery">▧</span><span>الصور والفيديو</span></button>
                <button type="button" data-attachment="camera"><span class="attachment-choice-icon camera">⌾</span><span>الكاميرا</span></button>
            </div>
        </footer>
    </main>

    <nav id="messageMenu" class="context-menu" hidden aria-label="خيارات الرسالة">
        <button data-action="reply" type="button">↩️ الرد</button>
        <button data-action="copy" type="button">📋 نسخ النص</button>
        <button data-action="forward" type="button">↪️ تحويل</button>
        <button data-action="star" type="button">⭐ تمييز بنجمة</button>
        <button data-action="info" type="button">ℹ️ معلومات الرسالة</button>
        <button data-action="delete-me" type="button">🗑️ حذف لدي</button>
        <button data-action="delete-all" class="danger" type="button">🚫 حذف لدى الجميع</button>
    </nav>

    <section id="messageInfoModal" class="modal-overlay" hidden aria-labelledby="messageInfoTitle">
        <div class="modal-card" role="dialog" aria-modal="true">
            <header class="modal-head">
                <h2 id="messageInfoTitle">معلومات الرسالة</h2>
                <button id="closeInfoButton" class="icon-button" type="button" aria-label="إغلاق">✕</button>
            </header>
            <div id="messageInfoBody" class="modal-body"></div>
            <div class="modal-actions">
                <button id="closeInfoAction" class="secondary-button" type="button">حسنًا</button>
            </div>
        </div>
    </section>

    <section id="notificationConfirmModal" class="modal-overlay" hidden aria-labelledby="notificationConfirmTitle">
        <div class="modal-card confirm-modal-card" role="dialog" aria-modal="true">
            <header class="modal-head">
                <h2 id="notificationConfirmTitle">تأكيد تعطيل الإشعارات</h2>
            </header>
            <div class="modal-body">
                <p id="notificationConfirmMessage"></p>
            </div>
            <div class="modal-actions">
                <button id="cancelNotificationConfirm" class="secondary-button" type="button">إلغاء</button>
                <button id="acceptNotificationConfirm" class="danger-button" type="button">متابعة</button>
            </div>
        </div>
    </section>

    <div id="toast" class="toast" role="status" hidden></div>

    <script type="module" src="../scripts/chat-beneficiary.js?v=49"></script>
</body>
</html>
