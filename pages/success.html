<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تم إرسال الطلب</title>
<style>

:root{

--primary:#007c4b;

--dark:#1b212c;

--gray:#6b7280;

--bg:#f4f5f7;

--gold:#d4af37;

}



*{

box-sizing:border-box;

margin:0;

padding:0;

font-family:'Cairo',sans-serif;

}



body{

background:var(--bg);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:20px;

}



.container{

width:100%;

max-width:420px;

}



.card{

background:white;

border-radius:25px;

padding:25px;

box-shadow:0 10px 30px rgba(0,0,0,.08);

text-align:center;

margin-top:50px;

}




.success-box{

background:white;

border-radius:20px;

padding:25px;

width:85%;

margin:-60px auto 25px;

box-shadow:0 5px 20px rgba(0,0,0,.08);

}



.icon{

width:65px;

height:65px;

background:#e8fff4;

border:3px solid var(--primary);

border-radius:50%;

display:flex;

align-items:center;

justify-content:center;

font-size:35px;

font-weight:bold;

color:var(--primary);

margin:-60px auto 15px;

}



h2{

font-size:20px;

color:var(--dark);

}



p{

color:var(--gray);

font-size:15px;

line-height:1.8;

}



.order-title{

margin-top:25px;

font-weight:bold;

color:var(--dark);

}



.order-box{

display:flex;

align-items:center;

justify-content:space-between;

border:1px solid #ddd;

border-radius:12px;

padding:15px;

margin-top:10px;

}



#transaction{

font-size:24px;

font-weight:bold;

color:var(--primary);

}



.copy{

background:#eee;

border:none;

border-radius:8px;

padding:8px 12px;

cursor:pointer;

}



</style>

    <!-- إعدادات تطبيق الويب PWA -->
    <link rel="manifest" href="../manifest.json?v=9">
    <link rel="icon" type="image/png" sizes="64x64" href="../icons/favicon-64.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon-v2.png">
    <meta name="theme-color" content="#006b35">
    <meta name="application-name" content="مؤسسة الوليد للإنسانية">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="الوليد">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="../scripts/pwa.js" defer></script>

    <!-- تنسيق موحد لأزرار الموقع وروابط الخدمات في الهيدر -->
    <!-- خط عربي محلي مُحمّل مبكراً لمنع تغير ارتفاع النص بعد فتح الصفحة -->
    <link rel="preload" href="../fonts/cairo-arabic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="../fonts/cairo-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="../styles/site-buttons.css">
    <script src="../scripts/site-ui.js" defer></script>
</head>


<body>


<div class="container">


<div class="card">



<div class="success-box">


<div class="icon">

✓

</div>



<h2>
لقد تم رفع الطلب بنجاح
</h2>



</div>





<p>

مرحباً بك عزيزي العميل

<br>

تم استلام طلبك بنجاح، وسيتم مراجعته من قبل الإدارة.

</p>







<div class="order-title">

رقم المعاملة الخاص بك

</div>






<div class="order-box">


<div id="transaction">

----

</div>



<button class="copy" onclick="copyTransaction()">

📋 نسخ

</button>


</div>







<div style="
background:#fff8df;
border:1px solid #d4af37;
padding:15px;
border-radius:15px;
margin-top:20px;
color:#6b4d00;
font-weight:bold;
">


⚠️ يرجى الاحتفاظ برقم المعاملة لمتابعة حالة الطلب.


</div>








<div style="margin-top:25px;">



<button onclick="trackOrder()" style="
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#007c4b;
color:white;
font-size:16px;
font-weight:bold;
margin-bottom:12px;
cursor:pointer;
">

🔍 متابعة الطلب

</button>







<button onclick="sendWhatsApp()" style="
width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#25D366;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
">

💬 إرسال عبر واتساب

</button>





</div>







<button onclick="home()" style="
margin-top:20px;
background:#1b212c;
color:white;
border:none;
padding:12px 35px;
border-radius:12px;
font-weight:bold;
cursor:pointer;
">


العودة للرئيسية


</button>







</div>


</div>
<script>


// جلب بيانات الطلب من التخزين المؤقت

const transactionId =
sessionStorage.getItem("transactionId") || "----";


const name =
sessionStorage.getItem("name") || "";


const phone =
sessionStorage.getItem("phone") || "";


const email =
sessionStorage.getItem("email") || "";


const idNumber =
sessionStorage.getItem("idNumber") || "";


const partNumber =
sessionStorage.getItem("partNumber") || "";


const country =
sessionStorage.getItem("country") || "";


const type =
sessionStorage.getItem("type") || "";


const notes =
sessionStorage.getItem("notes") || "";




// عرض رقم المعاملة

document.getElementById("transaction").innerText =
transactionId;







// نسخ رقم المعاملة

function copyTransaction(){


navigator.clipboard.writeText(transactionId);


alert("تم نسخ رقم المعاملة: " + transactionId);


}








// إرسال الواتساب

function sendWhatsApp(){



let adminPhone = "966580272758";



let message =

"📌 طلب جديد\n\n";



message +=
"رقم المعاملة: "
+
transactionId
+
"\n\n";



message +=
"الاسم: "
+
name
+
"\n";



message +=
"الجوال: "
+
phone
+
"\n";



message +=
"البريد: "
+
email
+
"\n";



message +=
"رقم الهوية: "
+
idNumber
+
"\n";



message +=
"رقم القطعة: "
+
partNumber
+
"\n";



message +=
"الدولة: "
+
country
+
"\n";



message +=
"نوع الطلب: "
+
type
+
"\n";



message +=
"التفاصيل: "
+
notes;





window.location.href =

"https://wa.me/"

+
adminPhone

+

"?text="

+

encodeURIComponent(message);



}

// الانتقال إلى صفحة التتبع

function trackOrder(){


window.location.href =

"track.html?transaction="

+

transactionId

+

"&phone="

+

phone;


}







// العودة للرئيسية

function home(){


window.location.href="index.html";


}



</script>


</body>


</html>
