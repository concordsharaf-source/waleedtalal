 <!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول الإدارة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
margin:0;
background:#f1f3f5;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}


.card{

width:90%;
max-width:400px;
background:#0d3b2b;
padding:35px;
border-radius:25px;
color:white;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.3);

}


h1{

margin-bottom:30px;

}


input{

width:100%;
padding:15px;
margin-bottom:15px;
border:none;
border-radius:12px;
font-size:16px;

}


button{

width:100%;
padding:15px;
background:#25D366;
border:none;
border-radius:12px;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;

}


#error{

margin-top:15px;
color:#ffcccc;

}


</style>

</head>


<body>


<div class="card">


<h1>
🔐 دخول الإدارة
</h1>


<input 
id="email"
type="email"
placeholder="البريد الإلكتروني">


<input 
id="password"
type="password"
placeholder="كلمة المرور">



<button onclick="login()">

دخول

</button>


<div id="error"></div>


</div>





<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
setPersistence,
browserLocalPersistence
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";



const firebaseConfig = {

apiKey: "AIzaSyDD_I84b3b6bmVxKjVx-tg2g7Cbd6RPcYz_Q",

authDomain: "sparepartswebsite1.firebaseapp.com",

projectId: "sparepartswebsite1",

storageBucket: "sparepartswebsite1.firebasestorage.app",

messagingSenderId: "1063114847735",

appId: "1:1063114847735:web:0e764c150ab10df2d82af2"

};



const app = initializeApp(firebaseConfig);

const auth = getAuth(app);



window.login = async function(){


let email =
document.getElementById("email").value.trim();


let password =
document.getElementById("password").value.trim();



if(!email || !password){

document.getElementById("error").innerHTML=
"⚠️ اكتب البريد وكلمة المرور";

return;

}


try{


await setPersistence(
auth,
browserLocalPersistence
);



await signInWithEmailAndPassword(
auth,
email,
password
);



window.location.replace(
"admon.html"
);



}

catch(error){


console.log(error);


document.getElementById("error").innerHTML=
"❌ البريد أو كلمة المرور غير صحيحة";


}



}


</script>


</body>

</html>
