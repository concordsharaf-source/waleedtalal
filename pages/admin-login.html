<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دخول الإدارة</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}


body{

margin:0;

background:#f0f2f5;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

}



.card{

width:90%;

max-width:400px;

background:#1a4332;

padding:35px;

border-radius:25px;

box-shadow:0 15px 40px rgba(0,0,0,.3);

color:white;

text-align:center;

}



.logo{

width:90px;

height:90px;

border-radius:50%;

background:url('images/xx.jpg');

background-size:cover;

margin:auto;

border:3px solid white;

margin-bottom:20px;

}



h1{

margin-bottom:25px;

}



input{

width:100%;

padding:15px;

margin-bottom:15px;

border:0;

border-radius:12px;

font-size:16px;

}



button{

width:100%;

padding:15px;

background:#25D366;

border:0;

border-radius:12px;

color:white;

font-size:18px;

font-weight:bold;

cursor:pointer;

}



#error{

color:#ffcccc;

margin-top:15px;

}


</style>


</head>


<body>


<div class="card">


<div class="logo"></div>


<h1>
دخول الإدارة
</h1>


<input 
type="email"
id="email"
placeholder="البريد الإلكتروني">


<input 
type="password"
id="password"
placeholder="كلمة المرور">



<button onclick="login()">

دخول

</button>



<div id="error"></div>


</div>





<script type="module">


import { initializeApp }

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getAuth,

signInWithEmailAndPassword

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";





const firebaseConfig = {


apiKey: "AIzaSyDD_I84b3b6bmVkjVx-t2g7Cbd6RPcYz_Q",

authDomain: "sparepartswebsite1.firebaseapp.com",

projectId: "sparepartswebsite1",

storageBucket: "sparepartswebsite1.firebasestorage.app",

messagingSenderId: "1063114847735",

appId: "1:1063114847735:web:0e764c150ab10df2d82af2"


};



const app = initializeApp(firebaseConfig);


const auth = getAuth(app);







window.login = function(){



let email =
document.getElementById("email").value;



let password =
document.getElementById("password").value;





signInWithEmailAndPassword(auth,email,password)


.then(()=>{


window.location.href="admin.html";


})


.catch((error)=>{


document.getElementById("error").innerHTML=

"❌ البريد أو كلمة المرور غير صحيحة";


});



}


</script>


</body>

</html>
