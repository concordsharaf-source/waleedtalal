<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مؤسسة الوليد الإنسانية | طلب مساعدة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap');

        :root { 
            --header-bg-image: url('images/xx.jpg');
            --card-bg-dark: #1a2522; 
            --input-bg-light: #f8f9fa; 
            --text-on-dark: #FFFFFF; 
            --accent-green: #25D366; 
            --gold: #d1b46a;
        }

        body { font-family: 'Cairo', Tahoma, sans-serif; margin: 0; padding: 0; background-color: #f0f2f5; color: #333; line-height: 1.6; }

        header { 
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), var(--header-bg-image); 
            background-size: cover; background-position: center; height: 40vh; 
            color: white; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 20px;
        }

        .logo {
            width: 110px; height: 110px;
            background-color: #fff;
            background-image: var(--header-bg-image);
            background-size: cover; background-position: center;
            border-radius: 50%; border: 4px solid rgba(255,255,255,0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 15px;
        }

        header h1 { margin: 5px 0; font-size: 2.2rem; font-weight: bold; }
        header p { margin: 0; font-size: 1.1rem; opacity: 0.9; max-width: 800px; }

        .form-card {
            max-width: 600px;
            margin: 0 auto 50px;
            background-color: var(--card-bg-dark);
            padding: 40px;
            border-radius: 25px;
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
        }

        .form-card h2 { text-align: center; font-size: 1.2rem; margin-bottom: 25px; color: var(--gold); }

        .input-group { margin-bottom: 18px; }
        .input-group label { font-weight: bold; display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-on-dark); }

        input, select, textarea {
            width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 1rem; box-sizing: border-box; background-color: var(--input-bg-light); color: #222;
        }

        .flex-group { display: flex; gap: 10px; }

        .payment-methods {
            display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 20px 0;
        }

        .method-btn {
            padding: 12px 5px; border: none; border-radius: 10px; cursor: pointer; background-color: #2c3e3a; color: #fff; font-size: 0.85rem; font-weight: bold; transition: 0.3s;
        }

        .method-btn.active { background-color: var(--gold); color: #1a2522; }

        .details-box { background-color: #fff; padding: 18px; border-radius: 12px; margin-bottom: 20px; display: none; border: 1px dashed var(--gold); }
        .details-box.active { display: block; }

        .address-copy {
            background: #f4f4f4; color: #333; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.8rem; word-break: break-all; margin: 10px 0; display: block; text-align: center; border: 1px solid #ddd;
        }

        .submit-whatsapp-btn {
            width: 100%; padding: 18px; background-color: #25D366; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: bold; cursor: pointer; color: white;
        }

        .whatsapp-float {
            position: fixed; bottom: 30px; left: 30px; background-color: #25D366; color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 1000; text-decoration: none;
        }

        .main-footer {
            background-color: #0f172a;
            color: #f1f5f9;
            padding: 50px 20px 20px;
            border-top: 4px solid #38bdf8;
        }

        .footer-container { max-width: 1100px; margin: 0 auto; text-align: center; }

        .contact-links, .links-grid {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
        }

        .contact-item, .links-grid a {
            color: #94a3b8;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <div class="logo"></div>
    <h1>مؤسسة الوليد الإنسانية</h1>
    <p>كن شريكاً في صناعة الأمل</p>
</header>

<div class="form-card">

    <h2>تقديم طلب تبرع جديد</h2>

    <form id="donationForm">

        <div class="input-group">
            <label>اسم المتبرع الكريم</label>
            <input id="name">
        </div>

        <div class="flex-group">
            <div class="input-group" style="flex:2;">
                <label>مبلغ التبرع</label>
                <input id="amount" type="number">
            </div>

            <div class="input-group" style="flex:1;">
                <label>العملة</label>
                <select id="currency">
                    <option>USD</option>
                    <option>SAR</option>
                    <option>AED</option>
                    <option>EUR</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>الجنسية</label>
            <input id="nationality">
        </div>

        <button type="button" id="sendWhatsapp" class="submit-whatsapp-btn">
            إرسال عبر واتساب
        </button>

    </form>

</div>

<footer class="main-footer">

<div class="contact-links">

    <a href="mailto:lamiamagedoffice1@gmail.com">📧 البريد الإلكتروني</a>

    <a href="https://wa.me/966569872542">💬 واتساب الدعم</a>

</div>

</footer>

    appId: "1:966569872542:web:154df6466c1c89d67f4a18"

document.getElementById('sendWhatsapp').onclick = async function () {

    const name = document.getElementById('name').value;
    const amount = document.getElementById('amount').value;
    const currency = document.getElementById('currency').value;
    const nationality = document.getElementById('nationality').value;

    const adminPhone = "966569872542";

</script>

</body>
</html>
