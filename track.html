<body>


<header>

<div class="logo"></div>

<h1>متابعة الطلب</h1>

<p>أدخل بياناتك لمعرفة حالة المعاملة</p>

</header>
<div class="container">


<div class="card">


<h2>
متابعة المعاملة
</h2>



<label>
رقم الجوال:
</label>

<input 
type="tel"
id="phone"
placeholder="أدخل رقم الجوال المسجل">





<label>
رقم المعاملة:
</label>

<input 
type="text"
id="transactionNumber"
placeholder="مثال: TEST-20260716-123456">





<button id="searchBtn">

بحث عن المعاملة

</button>




<div id="result"></div>



</div>


</div>






<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";



import {

getFirestore,

collection,

query,

where,

getDocs

}

from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyCwLJes8Wi47sbYFdx-M-wieVfrJtNwQrU",


authDomain: "smartx-5cfb1.firebaseapp.com",


projectId: "smartx-5cfb1",


storageBucket: "smartx-5cfb1.firebasestorage.app",


messagingSenderId: "429730063200",


appId: "1:429730063200:web:3e84e8d5bee4a755f97405"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);





const searchBtn = document.getElementById("searchBtn");


const result = document.getElementById("result");





searchBtn.onclick = async function(){



const phone =

document.getElementById("phone").value.trim();



const transactionNumber =

document.getElementById("transactionNumber").value.trim();





if(!phone || !transactionNumber){


alert("أدخل رقم الجوال ورقم المعاملة");


return;


}





searchBtn.innerHTML="جاري البحث...";





try{



const q = query(

collection(db,"transactions"),

where("phone","==",phone),

where("transactionNumber","==",transactionNumber)

);





const snapshot = await getDocs(q);





if(snapshot.empty){


result.style.display="block";


result.innerHTML=

`
<p class="error">
❌ لم يتم العثور على معاملة بهذه البيانات
</p>
`;



}

else{



snapshot.forEach(doc=>{


const data = doc.data();




result.style.display="block";


result.innerHTML=

`

<p class="success">
✅ تم العثور على المعاملة
</p>


<hr>


<p>
🔢 رقم المعاملة:
<br>
${data.transactionNumber}
</p>


<p>
👤 الاسم:
<br>
${data.name}
</p>


<p>
📂 نوع الطلب:
<br>
${data.type}
</p>


<p>
📌 الحالة:
<br>
${data.status}
</p>


`;



});



}



}

catch(error){


console.error(error);


result.style.display="block";


result.innerHTML=

`
<p class="error">
حدث خطأ أثناء البحث
</p>
`;



}



searchBtn.innerHTML="بحث عن المعاملة";



};



</script>
