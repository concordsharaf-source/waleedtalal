<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الموقع الرسمي</title>
    <style>
        /* التنسيقات الأساسية وتصفير المسافات */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            color: #333;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* تنسيق حاويات الأزرار لمحاذاتها في المنتصف */
        .btn-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        /* تنسيق أزرار "اسألني" البيضاء الثابتة */
        .ask-me-btn {
            background-color: #ffffff;
            color: #25D366; /* أخضر الواتساب */
            border: 2px solid #25D366;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .ask-me-btn:hover {
            background-color: #25D366;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
        }

        /* تنسيق قسم السلايدر (Carousel) */
        .carousel-section {
            width: 100%;
            max-width: 500px;
            margin: 20px 0;
            text-align: center;
        }

        .ap-carousel-item {
            display: none;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .ap-carousel-item.active {
            display: block;
        }

        .ap-carousel-item img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* نقاط التحكم بالسلايدر */
        .dots-container {
            margin-top: 10px;
        }

        .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background-color: #ccc;
            border-radius: 50%;
            margin: 0 5px;
            cursor: pointer;
        }

        .dot.active {
            background-color: #25D366;
        }

        /* تنسيق قسم العدادات */
        .counters-section {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 500px;
            margin: 30px 0;
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .counter-box {
            text-align: center;
        }

        .counter {
            font-size: 28px;
            font-weight: bold;
            color: #25D366;
        }

        .counter-label {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }

        /* تنسيق النافذة المنبثقة للواتساب (Modal) */
        .whatsapp-modal {
            display: none; /* مخفية تلقائياً */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            text-align: center;
            position: relative;
        }

        .modal-content h3 {
            margin-bottom: 15px;
            color: #222;
        }

        .modal-content textarea {
            width: 100%;
            height: 120px;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            resize: none;
            margin-bottom: 15px;
            font-size: 15px;
            outline: none;
        }

        .modal-content textarea:focus {
            border-color: #25D366;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-send {
            background-color: #25D366;
            color: white;
        }

        .btn-close {
            background-color: #eee;
            color: #333;
        }
    </style>
</head>
<body onload="runCounters()">

    <div class="btn-container">
        <button class="ask-me-btn" onclick="toggleWhatsAppModal()">اسألني</button>
    </div>

    <div class="carousel-section">
        <div class="ap-carousel-item active">
            <img src="images/pic1.png" alt="صورة 1">
        </div>
        <div class="ap-carousel-item">
            <img src="images/pic2.png" alt="صورة 2">
        </div>
        <div class="ap-carousel-item">
            <img src="images/pic3.png" alt="صورة 3">
        </div>

        <div class="dots-container">
            <span class="dot active" onclick="showSlide(0)"></span>
            <span class="dot" onclick="showSlide(1)"></span>
            <span class="dot" onclick="showSlide(2)"></span>
        </div>
    </div>

    <div class="counters-section">
        <div class="counter-box">
            <div class="counter" data-target="150">0</div>
            <div class="counter-label">عميل سعيد</div>
        </div>
        <div class="counter-box">
            <div class="counter" data-target="85">0</div>
            <div class="counter-label">مشروع مكتمل</div>
        </div>
        <div class="counter-box">
            <div class="counter" data-target="12">0</div>
            <div class="counter-label">الجوائز</div>
        </div>
    </div>

    <div class="btn-container">
        <button class="ask-me-btn" onclick="toggleWhatsAppModal()">اسألني</button>
    </div>

    <div class="whatsapp-modal" id="whatsappModal">
        <div class="modal-content">
            <h3>أرسل استفسارك مباشرة</h3>
            <textarea id="userNote" placeholder="اكتب ملاحظتك أو سؤالك هنا..."></textarea>
            <div class="modal-buttons">
                <button class="modal-btn btn-send" onclick="sendToWhatsApp()">إرسال عبر الواتساب</button>
                <button class="modal-btn btn-close" onclick="toggleWhatsAppModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // دالة فتح وإغلاق نافذة الواتساب
        function toggleWhatsAppModal() {
            const modal = document.getElementById('whatsappModal');
            if (!modal) return; 
            if (modal.style.display === 'none' || modal.style.display === '' || modal.style.display === 'none') {
                modal.style.display = 'flex';
            } else {
                modal.style.display = 'none';
            }
        }

        // دالة معالجة النص وإرساله إلى الواتساب
        function sendToWhatsApp() {
            const noteElement = document.getElementById('userNote');
            const note = noteElement.value.trim();
            const phoneNumber = "966569872542"; 

            if (note === "") {
                alert("فضلاً اكتب الملاحظة أولاً");
                return;
            }
            
            const prefix = "📢 *رسالة جديدة من الموقع الرسمي:*\n\n";
            const suffix = "\n\nــــــــــــــــــــــــــــــــ\n⚠️ *يرجى النظر في مشكلتي وحلها في أسرع وقت.*";
            
            const fullMessage = prefix + note + suffix;

            const encodedText = encodeURIComponent(fullMessage);
            const whatsappUrl = "https://api.whatsapp.com/send?phone=" + phoneNumber + "&text=" + encodedText;

            window.open(whatsappUrl, '_blank');
            toggleWhatsAppModal();
            noteElement.value = ""; 
        }
    </script>
        
    <script>
        // دالة تشغيل العدادات التصاعدية عند تحميل الصفحة
        function runCounters() {
            var counters = document.querySelectorAll('.counter');
        
            counters.forEach(function(item) {
                var target = parseInt(item.getAttribute('data-target'));
                var count = 0;
                var speed = target / 50; 

                var update = setInterval(function() {
                    count += speed;
                    if (count >= target) {
                        item.innerText = target;
                        clearInterval(update);
                    } else {
                        item.innerText = Math.floor(count);
                    }
                }, 30); 
            });
        }
    </script>

    <script>
        // دالة التحكم بالسلايدر (تغيير تلقائي كل 3 ثوانٍ)
        const apItemsSection = document.querySelectorAll('.ap-carousel-item');
        const dots = document.querySelectorAll('.dot');
        let apCurrentIdx = 0;

        function showSlide(index) {
            apItemsSection.forEach(item => item.classList.remove('active'));
            dots.forEach(dot => dot.classList.remove('active'));
            
            if(apItemsSection[index]) apItemsSection[index].classList.add('active');
            if(dots[index]) dots[index].classList.add('active');
            apCurrentIdx = index;
        }

        function nextDotSlide() {
            if(apItemsSection.length > 0) {
                apCurrentIdx = (apCurrentIdx + 1) % apItemsSection.length;
                showSlide(apCurrentIdx);
            }
        }

        setInterval(nextDotSlide, 3000);
    </script>

</body>
</html>
